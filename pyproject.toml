[project]
name = "developmentragenvironment"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sentence-transformers",
    "sentencepiece>=0.2.0",
    "pillow",
    "chromadb>=1.5.9",
    "markitdown[all]",
    "numpy",
    "rank-bm25>=0.2.2",
    "sudachipy>=0.6.11",
    "sudachidict-core>=20260428",
    "watchdog>=6.0.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.2",
]

# IMPROVEMENT_PLAN.md Phase5: 静的解析の軽量強化。
# select はruffの実質的な歴史的デフォルト（pycodestyle errors + pyflakes）に
# 明示的に固定している。素の `ruff check`（このバージョンの完全なデフォルト
# ルールセット）を既存コードベース全体に対して試したところ343件の指摘が
# 出た（UP=pyupgrade、FURB=refurb、S=bandit系のセキュリティ発見的ルール等、
# スタイル刷新寄りのルールが大半）。「軽量強化」の趣旨に対してスコープが
# 大きすぎるため、まずは実質的なバグ検出に直結するE4/E7/E9/Fに絞った
# （この範囲では26件まで縮小し、実際に修正した）。より広いルールセットの
# 採用は、CI導入後に別途判断する。
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
