<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="760" fill="var(--bg)"/><text class="title" x="26" y="36">つなぎ方の違い</text><text class="muted" x="26" y="58" font-size="13">左: 外の AI が Houdini を操作する型（fxhoudinimcp の公開された説明による） ／ 右: Houdini の中のパネルが、クラウドの知識と AI を使う型（本システム）</text><rect x="24" y="100" width="720" height="600" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ext)" stroke-width="2"/><text class="gtitle" x="42" y="128" fill="var(--ext)" style="fill:var(--ext)">MCP サーバー型（外の AI → Houdini）</text><rect x="776" y="100" width="700" height="600" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ui)" stroke-width="2"/><text class="gtitle" x="794" y="128" fill="var(--ui)" style="fill:var(--ui)">パネル＋クラウド型（Houdini → クラウドの知識と AI）</text><rect x="70" y="190" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="98.0" y="225.7" font-size="22" text-anchor="middle">AI</text><text class="label" x="98.0" y="266" text-anchor="middle">AI クライアント</text><text class="sub muted" x="98.0" y="282" text-anchor="middle">Claude・Cursor など</text><rect x="280" y="190" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="308.0" y="223.95" font-size="17" text-anchor="middle">MCP</text><text class="label" x="308.0" y="266" text-anchor="middle">MCP サーバー</text><text class="sub muted" x="308.0" y="282" text-anchor="middle">別プロセス（stdio）</text><rect x="490" y="190" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="518.0" y="223.95" font-size="17" text-anchor="middle">Hou</text><text class="label" x="518.0" y="266" text-anchor="middle">Houdini プラグイン</text><text class="sub muted" x="518.0" y="282" text-anchor="middle">hwebserver・ローカルHTTP</text><rect x="490" y="440" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="518.0" y="473.95" font-size="17" text-anchor="middle">hou</text><text class="label" x="518.0" y="516" text-anchor="middle">hou（メインスレッド）</text><text class="sub muted" x="518.0" y="532" text-anchor="middle">hdefereval で実行</text><rect x="280" y="440" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="308.0" y="473.95" font-size="17" text-anchor="middle">DOC</text><text class="label" x="308.0" y="516" text-anchor="middle">同梱マニュアル</text><text class="sub muted" x="308.0" y="532" text-anchor="middle">全文検索（3ツール）</text><text class="muted" x="44" y="640" font-size="12" text-anchor="start">認証・ツールごとの許可・書き込みの確認は、公開されている説明では見当たらない（ローカルだけで動かす前提）。</text><rect x="820" y="190" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="848.0" y="223.95" font-size="17" text-anchor="middle">Hou</text><text class="label" x="848.0" y="266" text-anchor="middle">Houdini パネル</text><text class="sub muted" x="848.0" y="282" text-anchor="middle">PySide（Houdini の中）</text><rect x="1050" y="190" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="1078.0" y="225.7" font-size="22" text-anchor="middle">W</text><text class="label" x="1078.0" y="266" text-anchor="middle">Worker</text><text class="sub muted" x="1078.0" y="282" text-anchor="middle">検索・Claude 中継・予算</text><text class="sub muted" x="1078.0" y="296" text-anchor="middle">HTTPS＋キー</text><rect x="1280" y="190" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1308.0" y="225.7" font-size="22" text-anchor="middle">AI</text><text class="label" x="1308.0" y="266" text-anchor="middle">Claude・Gemini</text><text class="sub muted" x="1308.0" y="282" text-anchor="middle">鍵は Worker だけ</text><rect x="820" y="440" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="848.0" y="473.95" font-size="17" text-anchor="middle">hou</text><text class="label" x="848.0" y="516" text-anchor="middle">ツール実行</text><text class="sub muted" x="848.0" y="532" text-anchor="middle">操作8＋完了の申告2</text><text class="sub muted" x="848.0" y="546" text-anchor="middle">hdefereval</text><rect x="1050" y="440" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="1078.0" y="473.95" font-size="17" text-anchor="middle">RAG</text><text class="label" x="1078.0" y="516" text-anchor="middle">知識（D1・Vectorize）</text><text class="sub muted" x="1078.0" y="532" text-anchor="middle">版ごと・章ごと</text><rect x="1280" y="440" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1308.0" y="473.95" font-size="17" text-anchor="middle">MCP</text><text class="label" x="1308.0" y="516" text-anchor="middle">外部サービス（MCP）</text><text class="sub muted" x="1308.0" y="532" text-anchor="middle">読み取り＋確認つき書き込み</text><text class="muted" x="796" y="640" font-size="12" text-anchor="start">操作は AI（Claude）の判断で進むが、触れるのはサンドボックスだけ。コード実行・ファイル書き込みのツールは持たない。</text><path class="edge" d="M 126.0 218.0 L 280.0 218.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="205.0" y="210.0" text-anchor="middle" style="fill:var(--core)">ツール呼び出し</text><path class="edge" d="M 336.0 218.0 L 490.0 218.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="415.0" y="210.0" text-anchor="middle" style="fill:var(--core)">ローカルHTTP</text><path class="edge" d="M 518.0 286.0 L 518.0 440.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><path class="edge dash" d="M 490.0 468.0 L 336.0 468.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><path class="edge" d="M 876.0 218.0 L 1050.0 218.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="950.0" y="210.0" text-anchor="middle" style="fill:var(--core)">質問・生成</text><path class="edge" d="M 1106.0 218.0 L 1280.0 218.0" style="stroke:var(--ext)" marker-end="url(#arrow-ext)" /><path class="edge" d="M 848.0 286.0 L 848.0 440.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><path class="edge" d="M 1078.0 300.0 L 1078.0 440.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><text class="elabel" x="1078.0" y="364.0" text-anchor="middle" style="fill:var(--store)">検索</text><path class="edge dash" d="M 1308.0 286.0 L 1308.0 440.0" style="stroke:var(--ext)" marker-end="url(#arrow-ext)" /><rect x="1422" y="726" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1442" y="738" font-size="12">保存</text><rect x="1316" y="726" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1336" y="738" font-size="12">外部サービス</text><rect x="1210" y="726" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1230" y="738" font-size="12">中核（処理）</text><rect x="1091" y="726" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1111" y="738" font-size="12">画面・利用者側</text></svg>