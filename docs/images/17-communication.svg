</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="1000" fill="var(--bg)"/><text class="title" x="26" y="36">通信構成図</text><text class="muted" x="26" y="58" font-size="13">どの部品が、どの方式で、誰から誰へつながっているか。矢印は、通信を始める側から出る（常時接続は使わない）</text><rect x="24" y="90" width="540" height="800" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ui)" stroke-width="2"/><text class="gtitle" x="42" y="118" fill="var(--ui)" style="fill:var(--ui)">利用者のPC</text><text class="gsub muted" x="42" y="136">Houdini・動画エンジン・ブラウザ。Local モードのブリッジ</text><rect x="610" y="90" width="590" height="800" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--core)" stroke-width="2"/><text class="gtitle" x="628" y="118" fill="var(--core)" style="fill:var(--core)">Cloudflare</text><text class="gsub muted" x="628" y="136">rag-poc（Worker）と ragreel-gallery。鍵は Secrets に保管</text><rect x="1246" y="90" width="234" height="800" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ext)" stroke-width="2"/><text class="gtitle" x="1264" y="118" fill="var(--ext)" style="fill:var(--ext)">外部のサービス</text><text class="gsub muted" x="1264" y="136">HTTPS の API・公開ファイル</text><rect x="60" y="160" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="88.0" y="193.95" font-size="17" text-anchor="middle">Hou</text><text class="label" x="88.0" y="236" text-anchor="middle">Houdini パネル</text><text class="sub muted" x="88.0" y="252" text-anchor="middle">PySide6（Houdini の中）</text><rect x="60" y="380" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="88.0" y="415.7" font-size="22" text-anchor="middle">FS</text><text class="label" x="88.0" y="456" text-anchor="middle">保存フォルダ</text><text class="sub muted" x="88.0" y="472" text-anchor="middle">手順書・画像・台本</text><rect x="400" y="380" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="428.0" y="415.7" font-size="22" text-anchor="middle">RR</text><text class="label" x="428.0" y="456" text-anchor="middle">RAGReel</text><text class="sub muted" x="428.0" y="472" text-anchor="middle">動画エンジン（別の exe）</text><rect x="60" y="600" width="56" height="56" rx="12" fill="var(--safe)"/><text class="glyph" x="88.0" y="633.95" font-size="17" text-anchor="middle">Brg</text><text class="label" x="88.0" y="676" text-anchor="middle">ローカルブリッジ</text><text class="sub muted" x="88.0" y="692" text-anchor="middle">localhost:8766</text><text class="sub muted" x="88.0" y="706" text-anchor="middle">Local モードだけ</text><rect x="230" y="600" width="56" height="56" rx="12" fill="var(--safe)"/><text class="glyph" x="258.0" y="633.95" font-size="17" text-anchor="middle">LLM</text><text class="label" x="258.0" y="676" text-anchor="middle">ローカル LLM の窓口</text><text class="sub muted" x="258.0" y="692" text-anchor="middle">127.0.0.1:8800</text><text class="sub muted" x="258.0" y="706" text-anchor="middle">loopback 以外は拒否</text><rect x="400" y="600" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="428.0" y="633.95" font-size="17" text-anchor="middle">WEB</text><text class="label" x="428.0" y="676" text-anchor="middle">ブラウザ</text><text class="sub muted" x="428.0" y="692" text-anchor="middle">管理画面・チャット・動画一覧</text><rect x="820" y="160" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="848.0" y="195.7" font-size="22" text-anchor="middle">W</text><text class="label" x="848.0" y="236" text-anchor="middle">Worker（rag-poc）</text><text class="sub muted" x="848.0" y="252" text-anchor="middle">/query /search /claude</text><text class="sub muted" x="848.0" y="266" text-anchor="middle">/tts /reference /pilot /mcp</text><rect x="680" y="480" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="708.0" y="515.7" font-size="22" text-anchor="middle">D1</text><text class="label" x="708.0" y="556" text-anchor="middle">D1</text><text class="sub muted" x="708.0" y="572" text-anchor="middle">記録・検索・予算</text><rect x="820" y="480" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="848.0" y="513.95" font-size="17" text-anchor="middle">Vec</text><text class="label" x="848.0" y="556" text-anchor="middle">Vectorize</text><text class="sub muted" x="848.0" y="572" text-anchor="middle">意味検索</text><rect x="960" y="480" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="988.0" y="515.7" font-size="22" text-anchor="middle">R2</text><text class="label" x="988.0" y="556" text-anchor="middle">R2</text><text class="sub muted" x="988.0" y="572" text-anchor="middle">Reference の画像</text><rect x="700" y="690" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="728.0" y="725.7" font-size="22" text-anchor="middle">W</text><text class="label" x="728.0" y="766" text-anchor="middle">Worker（ギャラリー）</text><text class="sub muted" x="728.0" y="782" text-anchor="middle">/api/videos</text><rect x="960" y="690" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="988.0" y="725.7" font-size="22" text-anchor="middle">R2</text><text class="label" x="988.0" y="766" text-anchor="middle">R2</text><text class="sub muted" x="988.0" y="782" text-anchor="middle">動画・サムネイル</text><rect x="1330" y="150" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1358.0" y="183.95" font-size="17" text-anchor="middle">Gem</text><text class="label" x="1358.0" y="226" text-anchor="middle">Gemini</text><text class="sub muted" x="1358.0" y="242" text-anchor="middle">埋め込み・回答</text><rect x="1330" y="270" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1358.0" y="305.7" font-size="22" text-anchor="middle">Cl</text><text class="label" x="1358.0" y="346" text-anchor="middle">Claude</text><text class="sub muted" x="1358.0" y="362" text-anchor="middle">チュートリアル・台本</text><rect x="1330" y="390" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1358.0" y="423.95" font-size="17" text-anchor="middle">TTS</text><text class="label" x="1358.0" y="466" text-anchor="middle">Google TTS</text><text class="sub muted" x="1358.0" y="482" text-anchor="middle">ナレーション</text><rect x="1330" y="510" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1358.0" y="543.95" font-size="17" text-anchor="middle">MCP</text><text class="label" x="1358.0" y="586" text-anchor="middle">公式 MCP</text><text class="sub muted" x="1358.0" y="602" text-anchor="middle">Notion・GitHub…</text><rect x="1330" y="630" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1358.0" y="665.7" font-size="22" text-anchor="middle">Sl</text><text class="label" x="1358.0" y="706" text-anchor="middle">Slack</text><text class="sub muted" x="1358.0" y="722" text-anchor="middle">Events API</text><rect x="1330" y="750" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1358.0" y="783.95" font-size="17" text-anchor="middle">Ref</text><text class="label" x="1358.0" y="826" text-anchor="middle">GitHub</text><text class="sub muted" x="1358.0" y="842" text-anchor="middle">HoudiniReference</text><text class="sub muted" x="1358.0" y="856" text-anchor="middle">data/items.json</text><text class="muted" x="330" y="206" font-size="12" text-anchor="start">Chat /query・実験 /pilot/*・Reference /reference/*・音声 /tts</text><text class="muted" x="60" y="738" font-size="12" text-anchor="start">ブリッジは、鍵を環境変数に持ち、Claude・Gemini へ</text><text class="muted" x="60" y="756" font-size="12" text-anchor="start">HTTPS で直接つなぐ（Cloudflare モードでは使わない）</text><text class="muted" x="640" y="604" font-size="12" text-anchor="start">↑ Cloudflare のバインディング（内部の呼び出し。通信の鍵は要らない）</text><text class="muted" x="900" y="150" font-size="12" text-anchor="start" font-weight="700">HTTPS（鍵は Worker だけ。予算つきで中継）</text><text class="muted" x="24" y="935" font-size="12.5" text-anchor="start">番号: ① パネル→Worker ② パネル→動画エンジン（プロセスの起動。通信ではない） ③ Local モード ④⑤ 動画エンジン→クラウド ⑥ 管理画面 ⑦ Slack ⑧ HoudiniReference</text><text class="muted" x="24" y="957" font-size="12.5" text-anchor="start">認証: パネル・エンジン→Worker は Bearer キー（ハッシュで照合）。ギャラリーへの送信は専用のトークン（大きい動画は分割して送る）。外部 API の鍵は、Worker の Secrets だけ。</text><path class="edge" d="M 116 188 L 820 188" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><text class="elabel" x="470" y="182" text-anchor="middle" style="fill:var(--core)">HTTPS の POST（JSON）＋ Bearer キー</text><circle cx="249.0" cy="177.0" r="11" fill="var(--core)"/><text class="badge-n" x="249.0" y="181.5" text-anchor="middle">1</text><path class="edge" d="M 88.0 256.0 L 88.0 380.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><text class="elabel" x="122.0" y="330.0" text-anchor="middle" style="fill:var(--ui)">書き出す</text><path class="edge" d="M 116 214 L 428 214 L 428 380" style="stroke:var(--ui)" marker-end="url(#arrow-ui)"/><text class="elabel" x="300" y="240" text-anchor="middle" style="fill:var(--ui)">起動（引数＋ファイル渡し）</text><circle cx="191.0" cy="235.0" r="11" fill="var(--ui)"/><text class="badge-n" x="191.0" y="239.5" text-anchor="middle">2</text><path class="edge" d="M 116.0 408.0 L 400.0 408.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><text class="elabel" x="255.0" y="400.0" text-anchor="middle" style="fill:var(--ui)">読む</text><path class="edge" d="M 60 188 L 40 188 L 40 628 L 60 628" style="stroke:var(--safe)" marker-end="url(#arrow-safe)"/><text class="elabel" x="100" y="586" text-anchor="middle" style="fill:var(--safe)">HTTP（localhost）</text><circle cx="-23.0" cy="581.0" r="11" fill="var(--safe)"/><text class="badge-n" x="-23.0" y="585.5" text-anchor="middle">3</text><path class="edge" d="M 116.0 628.0 L 230.0 628.0" style="stroke:var(--safe)" marker-end="url(#arrow-safe)" /><path class="edge" d="M 456 396 L 745 396 L 745 200 L 820 200" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><text class="elabel" x="620" y="390" text-anchor="middle" style="fill:var(--core)">HTTPS: 音声 /tts</text><circle cx="504.0" cy="385.0" r="11" fill="var(--core)"/><text class="badge-n" x="504.0" y="389.5" text-anchor="middle">4</text><path class="edge" d="M 456 424 L 500 424 L 500 718 L 700 718" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><text class="elabel" x="590" y="744" text-anchor="middle" style="fill:var(--core)">HTTPS: 動画の送信（トークン）</text><circle cx="446.0" cy="739.0" r="11" fill="var(--core)"/><text class="badge-n" x="446.0" y="743.5" text-anchor="middle">5</text><path class="edge" d="M 456 628 L 587 628 L 587 188" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><text class="elabel" x="572" y="620" text-anchor="middle" style="fill:var(--core)">HTTPS（管理画面）</text><circle cx="477.0" cy="615.0" r="11" fill="var(--core)"/><text class="badge-n" x="477.0" y="619.5" text-anchor="middle">6</text><path class="edge" d="M 456 650 L 728 650 L 728 690" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><text class="elabel" x="650" y="644" text-anchor="middle" style="fill:var(--core)">HTTPS（動画を見る）</text><path class="edge" d="M 848 300 L 848 340 L 708 340 L 708 480" style="stroke:var(--store)" marker-end="url(#arrow-store)"/><path class="edge" d="M 848 340 L 848 480" style="stroke:var(--store)" marker-end="url(#arrow-store)"/><path class="edge" d="M 848 340 L 988 340 L 988 480" style="stroke:var(--store)" marker-end="url(#arrow-store)"/><path class="edge" d="M 756.0 718.0 L 960.0 718.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><path class="edge" d="M 876 175 L 1226 175 L 1226 178 L 1330 178" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><path class="edge" d="M 1226 175 L 1226 298 L 1330 298" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><path class="edge" d="M 1226 298 L 1226 418 L 1330 418" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><path class="edge" d="M 1226 418 L 1226 538 L 1330 538" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><path class="edge" d="M 1330 658 L 1210 658 L 1210 205 L 876 205" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><text class="elabel" x="1100" y="652" text-anchor="middle" style="fill:var(--ext)">Events API（署名を検証）</text><circle cx="963.0" cy="647.0" r="11" fill="var(--ext)"/><text class="badge-n" x="963.0" y="651.5" text-anchor="middle">7</text><path class="edge dash" d="M 1330 778 L 1228 778 L 1228 850 L 170 850 L 170 232" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><text class="elabel" x="700" y="844" text-anchor="middle" style="fill:var(--ext)">HTTPS の GET: 関連の出典（1日1回・キャッシュ 24 時間）</text><circle cx="430.0" cy="839.0" r="11" fill="var(--ext)"/><text class="badge-n" x="430.0" y="843.5" text-anchor="middle">8</text><rect x="1383" y="966" width="14" height="14" rx="4" fill="var(--safe)"/><text class="muted" x="1403" y="978" font-size="12">安全・権限</text><rect x="1277" y="966" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1297" y="978" font-size="12">外部サービス</text><rect x="1223" y="966" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1243" y="978" font-size="12">保存</text><rect x="1117" y="966" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1137" y="978" font-size="12">中核（処理）</text><rect x="998" y="966" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1018" y="978" font-size="12">画面・利用者側</text></svg>