<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="760" fill="var(--bg)"/><text class="title" x="26" y="36">変更してから本番に出すまで（保守・拡張の標準の流れ）</text><text class="muted" x="26" y="58" font-size="13">番号の順。赤い工程（5・6）は、本番を変える。自動で進めず、名指しで許可してから行う</text><rect x="40" y="140" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="155.0" y="176.0" text-anchor="middle">変更する</text><text class="sub muted" x="155.0" y="194.0" text-anchor="middle">コード・テスト・ドキュメント</text><text class="sub muted" x="155.0" y="210.0" text-anchor="middle">DB なら migrations/ に SQL</text><rect x="340" y="140" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="455.0" y="176.0" text-anchor="middle">型を検査する</text><text class="sub muted" x="455.0" y="194.0" text-anchor="middle">cd cloudflare-rag-poc</text><text class="sub muted" x="455.0" y="210.0" text-anchor="middle">npx tsc --noEmit</text><rect x="640" y="140" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="755.0" y="176.0" text-anchor="middle">テストする</text><text class="sub muted" x="755.0" y="194.0" text-anchor="middle">Worker: npm test</text><text class="sub muted" x="755.0" y="210.0" text-anchor="middle">Houdini: unittest discover</text><rect x="940" y="140" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1055.0" y="176.0" text-anchor="middle">画面で通し確認</text><text class="sub muted" x="1055.0" y="194.0" text-anchor="middle">hython で、パネルを作って動かす</text><text class="sub muted" x="1055.0" y="210.0" text-anchor="middle">（Houdini 側を変えたとき）</text><rect x="1240" y="140" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><text class="label" x="1355.0" y="176.0" text-anchor="middle">D1 に適用（本番）</text><text class="sub muted" x="1355.0" y="194.0" text-anchor="middle">wrangler d1 migrations</text><text class="sub muted" x="1355.0" y="210.0" text-anchor="middle">apply --remote（戻せない）</text><rect x="1240" y="400" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><text class="label" x="1355.0" y="436.0" text-anchor="middle">Worker をデプロイ</text><text class="sub muted" x="1355.0" y="454.0" text-anchor="middle">npx wrangler deploy</text><text class="sub muted" x="1355.0" y="470.0" text-anchor="middle">戻すなら wrangler rollback</text><rect x="940" y="400" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1055.0" y="436.0" text-anchor="middle">動作を確かめる</text><text class="sub muted" x="1055.0" y="454.0" text-anchor="middle">未認証で 401・画面・実機</text><text class="sub muted" x="1055.0" y="470.0" text-anchor="middle">新しい API は 404 でないこと</text><rect x="640" y="400" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="755.0" y="436.0" text-anchor="middle">パネルを配置</text><text class="sub muted" x="755.0" y="454.0" text-anchor="middle">deploy_panels.py 22.0</text><text class="sub muted" x="755.0" y="470.0" text-anchor="middle">--pypanel → Houdini を再起動</text><rect x="340" y="400" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="455.0" y="436.0" text-anchor="middle">ドキュメントを直す</text><text class="sub muted" x="455.0" y="454.0" text-anchor="middle">関係する資料・図・講義</text><text class="sub muted" x="455.0" y="470.0" text-anchor="middle">日付と、変えた理由を書く</text><rect x="40" y="400" width="230" height="100" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="155.0" y="436.0" text-anchor="middle">コミット・プッシュ</text><text class="sub muted" x="155.0" y="454.0" text-anchor="middle">実際に出した内容と同じ版を</text><text class="sub muted" x="155.0" y="470.0" text-anchor="middle">local-chat/ などは入れない</text><circle cx="54" cy="138" r="11" fill="var(--core)"/><text class="badge-n" x="54" y="142.5" text-anchor="middle">1</text><circle cx="354" cy="138" r="11" fill="var(--core)"/><text class="badge-n" x="354" y="142.5" text-anchor="middle">2</text><circle cx="654" cy="138" r="11" fill="var(--core)"/><text class="badge-n" x="654" y="142.5" text-anchor="middle">3</text><circle cx="954" cy="138" r="11" fill="var(--core)"/><text class="badge-n" x="954" y="142.5" text-anchor="middle">4</text><circle cx="1254" cy="138" r="11" fill="var(--warn)"/><text class="badge-n" x="1254" y="142.5" text-anchor="middle">5</text><circle cx="1254" cy="398" r="11" fill="var(--warn)"/><text class="badge-n" x="1254" y="402.5" text-anchor="middle">6</text><circle cx="954" cy="398" r="11" fill="var(--core)"/><text class="badge-n" x="954" y="402.5" text-anchor="middle">7</text><circle cx="654" cy="398" r="11" fill="var(--core)"/><text class="badge-n" x="654" y="402.5" text-anchor="middle">8</text><circle cx="354" cy="398" r="11" fill="var(--core)"/><text class="badge-n" x="354" y="402.5" text-anchor="middle">9</text><circle cx="54" cy="398" r="11" fill="var(--core)"/><text class="badge-n" x="54" y="402.5" text-anchor="middle">10</text><text class="muted" x="40" y="560" font-size="13" text-anchor="start">順序の理由: D1（表の形）を先に変え、そのあと Worker を出す。逆だと、新しい Worker が、まだ無い列を読んでエラーになる。</text><text class="muted" x="40" y="586" font-size="13" text-anchor="start">パネルは、Worker を出したあとに配る。先に配ると、新しい機能が「サーバーが、この機能にまだ対応していません」（404）と出る。</text><text class="muted" x="40" y="612" font-size="13" text-anchor="start">戻し方: Worker は wrangler rollback。D1 は自動では戻らないので、打ち消す SQL を、新しいマイグレーションとして足す。</text><text class="muted" x="40" y="638" font-size="13" text-anchor="start">本番に触る操作（5・6）は、人が名指しで許可してから行う。テスト用の値と、本番のキーは混ぜない。</text><path class="edge" d="M 270.0 190.0 L 340.0 190.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 570.0 190.0 L 640.0 190.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 870.0 190.0 L 940.0 190.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 1170.0 190.0 L 1240.0 190.0" style="stroke:var(--warn)" marker-end="url(#arrow-warn)" /><path class="edge" d="M 1355.0 240.0 L 1355.0 400.0" style="stroke:var(--warn)" marker-end="url(#arrow-warn)" /><path class="edge" d="M 1240.0 450.0 L 1170.0 450.0" style="stroke:var(--warn)" marker-end="url(#arrow-warn)" /><path class="edge" d="M 940.0 450.0 L 870.0 450.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 640.0 450.0 L 570.0 450.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 340.0 450.0 L 270.0 450.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge dash" d="M 755 140 L 755 100 L 155 100 L 155 140" style="stroke:var(--warn)" marker-end="url(#arrow-warn)"/><text class="elabel" x="455" y="92" text-anchor="middle" style="fill:var(--warn)">失敗したら、1 に戻って直す</text><rect x="1422" y="726" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1442" y="738" font-size="12">保存</text><rect x="1329" y="726" width="14" height="14" rx="4" fill="var(--warn)"/><text class="muted" x="1349" y="738" font-size="12">注意・制限</text><rect x="1223" y="726" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1243" y="738" font-size="12">中核（処理）</text><rect x="1104" y="726" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1124" y="738" font-size="12">画面・利用者側</text></svg>