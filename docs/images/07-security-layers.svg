<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 840" width="1300" height="840" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1300" height="840" fill="var(--bg)"/><text class="title" x="26" y="36">守りの層（リクエストが通る順）</text><text class="muted" x="26" y="58" font-size="13">上から順に確認し、どこかで止まったら、そこで終わる</text><rect x="90" y="100" width="960" height="80" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="570.0" y="137.0" text-anchor="middle">画面を守る</text><text class="sub muted" x="570.0" y="155.0" text-anchor="middle">他のサイトの枠に埋め込めない（X-Frame-Options・frame-ancestors）。Referer を送らない</text><circle cx="62" cy="140" r="11" fill="var(--safe)"/><text class="badge-n" x="62" y="144.5" text-anchor="middle">1</text><text class="muted" x="1066" y="144" font-size="11.5" text-anchor="start">http.ts・index.ts</text><rect x="90" y="196" width="960" height="80" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="570.0" y="233.0" text-anchor="middle">APIキー</text><text class="sub muted" x="570.0" y="251.0" text-anchor="middle">32バイトの乱数。ハッシュで照合・期限つき。無効と期限切れは同じ応答（存在を教えない）</text><circle cx="62" cy="236" r="11" fill="var(--safe)"/><text class="badge-n" x="62" y="240.5" text-anchor="middle">2</text><text class="muted" x="1066" y="240" font-size="11.5" text-anchor="start">auth.ts</text><rect x="90" y="292" width="960" height="80" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="570.0" y="329.0" text-anchor="middle">ロール</text><text class="sub muted" x="570.0" y="347.0" text-anchor="middle">admin / editor / member / guest。管理の操作は admin、ナレッジ登録は editor まで</text><circle cx="62" cy="332" r="11" fill="var(--safe)"/><text class="badge-n" x="62" y="336.5" text-anchor="middle">3</text><text class="muted" x="1066" y="336" font-size="11.5" text-anchor="start">auth.ts</text><rect x="90" y="388" width="960" height="80" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="570.0" y="425.0" text-anchor="middle">ナレッジの範囲</text><text class="sub muted" x="570.0" y="443.0" text-anchor="middle">namespace の許可リスト。共有と個人（personal:）は別。他人の個人用には書けない</text><circle cx="62" cy="428" r="11" fill="var(--safe)"/><text class="badge-n" x="62" y="432.5" text-anchor="middle">4</text><text class="muted" x="1066" y="432" font-size="11.5" text-anchor="start">auth.ts・retrieve.ts</text><rect x="90" y="484" width="960" height="80" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="570.0" y="521.0" text-anchor="middle">予算と回数</text><text class="sub muted" x="570.0" y="539.0" text-anchor="middle">キーごとのトークン・文字数・回数の上限。超えたら 429 で止まる</text><circle cx="62" cy="524" r="11" fill="var(--safe)"/><text class="badge-n" x="62" y="528.5" text-anchor="middle">5</text><text class="muted" x="1066" y="528" font-size="11.5" text-anchor="start">budget.ts・rateLimit.ts</text><rect x="90" y="580" width="960" height="80" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><text class="label" x="570.0" y="617.0" text-anchor="middle">外部との接続</text><text class="sub muted" x="570.0" y="635.0" text-anchor="middle">接続先は登録簿のURLだけ。OAuth の state は1回・10分。Backlog はドメイン限定。書き込みは確認</text><circle cx="62" cy="620" r="11" fill="var(--warn)"/><text class="badge-n" x="62" y="624.5" text-anchor="middle">6</text><text class="muted" x="1066" y="624" font-size="11.5" text-anchor="start">mcp/・*OAuth.ts</text><rect x="90" y="676" width="960" height="80" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="570.0" y="713.0" text-anchor="middle">記録</text><text class="sub muted" x="570.0" y="731.0" text-anchor="middle">監査ログに、誰が・何を・成否を残す。引数の中身は残さない。180日で削除</text><circle cx="62" cy="716" r="11" fill="var(--store)"/><text class="badge-n" x="62" y="720.5" text-anchor="middle">7</text><text class="muted" x="1066" y="720" font-size="11.5" text-anchor="start">mcp_audit・audit_log</text><path class="edge" d="M 570.0 180.0 L 570.0 196.0" style="stroke:var(--gray)" marker-end="url(#arrow-gray)" /><path class="edge" d="M 570.0 276.0 L 570.0 292.0" style="stroke:var(--gray)" marker-end="url(#arrow-gray)" /><path class="edge" d="M 570.0 372.0 L 570.0 388.0" style="stroke:var(--gray)" marker-end="url(#arrow-gray)" /><path class="edge" d="M 570.0 468.0 L 570.0 484.0" style="stroke:var(--gray)" marker-end="url(#arrow-gray)" /><path class="edge" d="M 570.0 564.0 L 570.0 580.0" style="stroke:var(--gray)" marker-end="url(#arrow-gray)" /><path class="edge" d="M 570.0 660.0 L 570.0 676.0" style="stroke:var(--gray)" marker-end="url(#arrow-gray)" /><rect x="1222" y="806" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1242" y="818" font-size="12">保存</text><rect x="1129" y="806" width="14" height="14" rx="4" fill="var(--warn)"/><text class="muted" x="1149" y="818" font-size="12">注意・制限</text><rect x="1036" y="806" width="14" height="14" rx="4" fill="var(--safe)"/><text class="muted" x="1056" y="818" font-size="12">安全・権限</text></svg>