<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 790" width="1500" height="790" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="790" fill="var(--bg)"/><text class="title" x="26" y="36">課題1回の状態の移り変わり</text><text class="muted" x="26" y="58" font-size="13">ボタンを押すたびに、どう変わるか。サーバーに残るのは「計測中」と「完了」。破棄した記録は、消さずに残して集計から外す</text><rect x="40" y="330" width="190" height="100" rx="10" fill="var(--card)" stroke="var(--gray)" stroke-width="2"/><text class="label" x="135.0" y="377.0" text-anchor="middle">未開始</text><text class="sub muted" x="135.0" y="395.0" text-anchor="middle">「開始」を押せる</text><rect x="420" y="330" width="190" height="100" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="515.0" y="366.0" text-anchor="middle">計測中</text><text class="sub muted" x="515.0" y="384.0" text-anchor="middle">時間とエラーを記録</text><text class="sub muted" x="515.0" y="400.0" text-anchor="middle">20秒ごとに採取</text><rect x="800" y="330" width="190" height="100" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="895.0" y="366.0" text-anchor="middle">振り返り</text><text class="sub muted" x="895.0" y="384.0" text-anchor="middle">アンケートに答える</text><text class="sub muted" x="895.0" y="400.0" text-anchor="middle">時間は、終了を押した所まで</text><rect x="1180" y="330" width="190" height="100" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="1275.0" y="366.0" text-anchor="middle">完了</text><text class="sub muted" x="1275.0" y="384.0" text-anchor="middle">所要時間・質問回数を確定</text><text class="sub muted" x="1275.0" y="400.0" text-anchor="middle">両方終えたら、次の回へ</text><rect x="420" y="120" width="190" height="100" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><text class="label" x="515.0" y="156.0" text-anchor="middle">中断</text><text class="sub muted" x="515.0" y="174.0" text-anchor="middle">Houdini が閉じた・落ちた</text><text class="sub muted" x="515.0" y="190.0" text-anchor="middle">記録はサーバーに残る</text><text class="muted" x="800" y="515" font-size="12.5" text-anchor="start" font-weight="700">送信に失敗したら、答えを残して「答えを再送する」</text><text class="muted" x="40" y="700" font-size="13" text-anchor="start">やり直しで破棄した記録は、消さずに残す（やり直した回数が分析で分かる）。集計と、次の課題の判定には入れない。</text><text class="muted" x="40" y="724" font-size="13" text-anchor="start">再開すると、エラーのノードを引き継ぎ、閉じていた時間（40秒以上の空き）は「中断」として所要時間から引く。</text><text class="muted" x="40" y="748" font-size="13" text-anchor="start">次の回の課題を始めたあとは、前の回はやり直せない（回の順序と、対照の割り当てを崩さないため）。</text><path class="edge" d="M 230.0 380.0 L 420.0 380.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="335.0" y="372.0" text-anchor="middle" style="fill:var(--core)">開始</text><circle cx="303.0" cy="367.0" r="11" fill="var(--core)"/><text class="badge-n" x="303.0" y="371.5" text-anchor="middle">1</text><path class="edge" d="M 610.0 380.0 L 800.0 380.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="715.0" y="372.0" text-anchor="middle" style="fill:var(--core)">終了を押す</text><circle cx="662.0" cy="367.0" r="11" fill="var(--core)"/><text class="badge-n" x="662.0" y="371.5" text-anchor="middle">2</text><path class="edge" d="M 990.0 380.0 L 1180.0 380.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><text class="elabel" x="1095.0" y="372.0" text-anchor="middle" style="fill:var(--store)">送信</text><circle cx="1063.0" cy="367.0" r="11" fill="var(--store)"/><text class="badge-n" x="1063.0" y="371.5" text-anchor="middle">3</text><path class="edge dash" d="M 895 430 L 895 480 L 565 480 L 565 430" style="stroke:var(--ui)" marker-end="url(#arrow-ui)"/><text class="elabel" x="730" y="472" text-anchor="middle" style="fill:var(--ui)">戻る（終了を取り消す）</text><path class="edge dash" d="M 480 330 L 480 220" style="stroke:var(--warn)" marker-end="url(#arrow-warn)"/><text class="elabel" x="412" y="282" text-anchor="middle" style="fill:var(--warn)">閉じる・落ちる</text><path class="edge dash" d="M 550 220 L 550 330" style="stroke:var(--warn)" marker-end="url(#arrow-warn)"/><text class="elabel" x="622" y="282" text-anchor="middle" style="fill:var(--warn)">続きから開始</text><path class="edge" d="M 460 430 L 460 560 L 135 560 L 135 430" style="stroke:var(--warn)" marker-end="url(#arrow-warn)"/><text class="elabel" x="298" y="552" text-anchor="middle" style="fill:var(--warn)">計測をやり直す（破棄）</text><path class="edge" d="M 1275 430 L 1275 650 L 90 650 L 90 430" style="stroke:var(--warn)" marker-end="url(#arrow-warn)"/><text class="elabel" x="680" y="642" text-anchor="middle" style="fill:var(--warn)">完了した記録の「やり直す」（次の回を始める前だけ）</text><rect x="1422" y="756" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1442" y="768" font-size="12">保存</text><rect x="1329" y="756" width="14" height="14" rx="4" fill="var(--warn)"/><text class="muted" x="1349" y="768" font-size="12">注意・制限</text><rect x="1223" y="756" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1243" y="768" font-size="12">中核（処理）</text><rect x="1104" y="756" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1124" y="768" font-size="12">画面・利用者側</text></svg>