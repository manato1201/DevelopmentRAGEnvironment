<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" width="1300" height="820" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1300" height="820" fill="var(--bg)"/><text class="title" x="26" y="36">同じ Houdini と AI でも、立ち位置が違う</text><text class="muted" x="26" y="58" font-size="13">縦軸: Houdini を外の AI から操作する範囲 ／ 横軸: 知識（ドキュメント検索）の厚み。筆者の整理で、数値ではありません</text><rect x="130" y="110" width="1100" height="610" rx="14" fill="var(--panel)" fill-opacity="0.6" stroke="var(--line)" stroke-width="1.5"/><line x1="680" y1="110" x2="680" y2="720" stroke="var(--grid)" stroke-width="2" stroke-dasharray="6 6"/><line x1="130" y1="415" x2="1230" y2="415" stroke="var(--grid)" stroke-width="2" stroke-dasharray="6 6"/><text class="muted" x="680" y="756" font-size="14" text-anchor="middle" font-weight="700">知識（ドキュメント検索）が厚い →</text><text class="muted" x="130" y="756" font-size="12.5" text-anchor="start">薄い（なし・全文検索のみ）</text><text class="muted" x="1230" y="756" font-size="12.5" text-anchor="end">厚い（索引・RAG・版ごとの区別）</text><text class="muted" transform="translate(70 415) rotate(-90)" text-anchor="middle" font-size="14" font-weight="700">Houdini を操作できる範囲 →</text><text class="muted" x="138" y="132" font-size="12" text-anchor="start">広い（数百のツール）</text><text class="muted" x="138" y="710" font-size="12" text-anchor="start">狭い（数個）</text><rect x="470" y="170" width="48" height="48" rx="12" fill="var(--ext)"/><text class="label" x="494.0" y="238" text-anchor="middle">fxhoudinimcp</text><text class="sub muted" x="494.0" y="254" text-anchor="middle">215ツール・版ごとの全文検索</text><rect x="190" y="200" width="48" height="48" rx="12" fill="var(--gray)"/><text class="label" x="214.0" y="268" text-anchor="middle">dcc-mcp-core</text><text class="sub muted" x="214.0" y="284" text-anchor="middle">47種の DCC を束ねる</text><rect x="330" y="340" width="48" height="48" rx="12" fill="var(--ext)"/><text class="label" x="354.0" y="408" text-anchor="middle">oculairmedia</text><text class="sub muted" x="354.0" y="424" text-anchor="middle">43ツール・hrpyc</text><rect x="190" y="430" width="48" height="48" rx="12" fill="var(--ext)"/><text class="label" x="214.0" y="498" text-anchor="middle">capoomgit</text><text class="sub muted" x="214.0" y="514" text-anchor="middle">基本の操作・コード実行</text><rect x="740" y="280" width="48" height="48" rx="12" fill="var(--ext)"/><text class="label" x="764.0" y="348" text-anchor="middle">Synapse</text><text class="sub muted" x="764.0" y="364" text-anchor="middle">Houdini 内のアシスタント</text><rect x="740" y="560" width="48" height="48" rx="12" fill="var(--ext)"/><text class="label" x="764.0" y="628" text-anchor="middle">Houdini21MCP</text><text class="sub muted" x="764.0" y="644" text-anchor="middle">10ツール＋BM25 検索</text><rect x="1020" y="520" width="48" height="48" rx="12" fill="var(--ui)"/><text class="glyph" x="1044.0" y="551.7" font-size="22" text-anchor="middle">★</text><text class="label" x="1044.0" y="588" text-anchor="middle">本システム</text><text class="sub muted" x="1044.0" y="604" text-anchor="middle">RAG＋教材・動画の制作</text><text class="muted" x="1020" y="700" font-size="11.5" text-anchor="middle">操作は、サンドボックス内の8ツール（＋完了の申告2）</text><rect x="1222" y="786" width="14" height="14" rx="4" fill="var(--gray)"/><text class="muted" x="1242" y="798" font-size="12">補助</text><rect x="1116" y="786" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1136" y="798" font-size="12">外部サービス</text><rect x="997" y="786" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1017" y="798" font-size="12">画面・利用者側</text></svg>