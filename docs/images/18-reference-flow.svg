<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="900" fill="var(--bg)"/><text class="title" x="26" y="36">Reference タブの仕組み</text><text class="muted" x="26" y="58" font-size="13">説明は、開発側が作って点検してから置く。参加者の端末は読むだけ。HoudiniReference は、関連のリンク（出典）だけに使う</text><rect x="24" y="90" width="700" height="760" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ui)" stroke-width="2"/><text class="gtitle" x="42" y="118" fill="var(--ui)" style="fill:var(--ui)">開発側（開発者の PC）</text><text class="gsub muted" x="42" y="136">作る → 点検する → 撮る → 公開する。点検に通らないものは公開しない</text><rect x="760" y="90" width="360" height="520" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--core)" stroke-width="2"/><text class="gtitle" x="778" y="118" fill="var(--core)" style="fill:var(--core)">Cloudflare（rag-poc）</text><text class="gsub muted" x="778" y="136">置き場。参加者の端末は、ここから読む</text><rect x="760" y="640" width="360" height="210" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ext)" stroke-width="2"/><text class="gtitle" x="778" y="668" fill="var(--ext)" style="fill:var(--ext)">HoudiniReference（別リポジトリ）</text><text class="gsub muted" x="778" y="686">Tips・動画・ニュース。題名・URL・日付・抜粋だけ</text><rect x="1160" y="90" width="316" height="760" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ui)" stroke-width="2"/><text class="gtitle" x="1178" y="118" fill="var(--ui)" style="fill:var(--ui)">参加者の PC（Reference タブ）</text><text class="gsub muted" x="1178" y="136">説明・画像・動きと、関連の出典</text><rect x="48" y="150" width="300" height="84" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="198.0" y="178.0" text-anchor="middle">SideFX 公式ドキュメント</text><text class="sub muted" x="198.0" y="196.0" text-anchor="middle">RAG に登録済み（Worker の /search）</text><text class="sub muted" x="198.0" y="212.0" text-anchor="middle">説明の材料（資料）</text><rect x="380" y="150" width="320" height="84" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="540.0" y="178.0" text-anchor="middle">実機の Houdini 22（hython）</text><text class="sub muted" x="540.0" y="196.0" text-anchor="middle">ノードの実在・本物のパラメータ名・撮影</text><text class="sub muted" x="540.0" y="212.0" text-anchor="middle">vcc で VEX の関数の実在も確かめる</text><rect x="48" y="300" width="300" height="84" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="198.0" y="328.0" text-anchor="middle">説明を書く</text><text class="sub muted" x="198.0" y="346.0" text-anchor="middle">build_reference_entries.py（Claude）</text><text class="sub muted" x="198.0" y="362.0" text-anchor="middle">資料＋実機の名前＋撮影の手順を渡す</text><rect x="380" y="300" width="320" height="84" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="540.0" y="328.0" text-anchor="middle">実機と突き合わせる（点検）</text><text class="sub muted" x="540.0" y="346.0" text-anchor="middle">audit_reference.py</text><text class="sub muted" x="540.0" y="362.0" text-anchor="middle">本物に無い名前・関数は、公開しない</text><rect x="48" y="450" width="300" height="84" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="198.0" y="478.0" text-anchor="middle">撮る（33 ノード）</text><text class="sub muted" x="198.0" y="496.0" text-anchor="middle">capture.py ＋ recipes.py</text><text class="sub muted" x="198.0" y="512.0" text-anchor="middle">適用前・後・値を動かす GIF</text><rect x="380" y="450" width="320" height="84" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="540.0" y="478.0" text-anchor="middle">公開する</text><text class="sub muted" x="540.0" y="496.0" text-anchor="middle">publish_reference.py（HTTPS の POST・管理者キー）</text><text class="sub muted" x="540.0" y="512.0" text-anchor="middle">点検に通ったものだけ。画像はハッシュ入りの名前</text><text class="muted" x="48" y="560" font-size="12.5" text-anchor="start">撮影の検査: 値を初期値に戻して形が変わらない値は、「効く」と書けないので撮らない。</text><text class="muted" x="48" y="582" font-size="12.5" text-anchor="start">適用の前後で何も変わらない絵は、載せない（読んだ人が、同じ手順で何も起きないと困るため）。</text><text class="muted" x="48" y="604" font-size="12.5" text-anchor="start">説明の中の「」で囲んだ英字の名前は、そのノードの本物の名前か、レシピで設定した値だけ。</text><rect x="790" y="150" width="300" height="84" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="940.0" y="178.0" text-anchor="middle">Worker</text><text class="sub muted" x="940.0" y="196.0" text-anchor="middle">/admin/reference/put・media_put</text><text class="sub muted" x="940.0" y="212.0" text-anchor="middle">/reference/index・entry・media（取得）</text><rect x="790" y="290" width="300" height="84" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="940.0" y="318.0" text-anchor="middle">D1: reference_entries</text><text class="sub muted" x="940.0" y="336.0" text-anchor="middle">説明・media の一覧・version</text><text class="sub muted" x="940.0" y="352.0" text-anchor="middle">kind＋key で 1 件（0038）</text><rect x="790" y="430" width="300" height="84" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="940.0" y="458.0" text-anchor="middle">R2: rag-poc-reference</text><text class="sub muted" x="940.0" y="476.0" text-anchor="middle">画像・GIF（最大 12MB）</text><text class="sub muted" x="940.0" y="492.0" text-anchor="middle">id に内容のハッシュ → 撮り直すと端末が取り直す</text><rect x="790" y="700" width="300" height="84" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="940.0" y="728.0" text-anchor="middle">GitHub: HoudiniReference</text><text class="sub muted" x="940.0" y="746.0" text-anchor="middle">data/items.json</text><text class="sub muted" x="940.0" y="762.0" text-anchor="middle">毎日 収集（公式フィード・API）。約 400 件</text><rect x="1184" y="150" width="268" height="84" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="1318.0" y="178.0" text-anchor="middle">① 版を見る</text><text class="sub muted" x="1318.0" y="196.0" text-anchor="middle">index の version</text><text class="sub muted" x="1318.0" y="212.0" text-anchor="middle">変わった項目だけ取り直す</text><rect x="1184" y="290" width="268" height="84" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="1318.0" y="318.0" text-anchor="middle">② 取ってきて、保存する</text><text class="sub muted" x="1318.0" y="336.0" text-anchor="middle">説明・画像・GIF</text><text class="sub muted" x="1318.0" y="352.0" text-anchor="middle">端末のキャッシュ（古いものは整理）</text><rect x="1184" y="430" width="268" height="84" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="1318.0" y="458.0" text-anchor="middle">③ 表示する</text><text class="sub muted" x="1318.0" y="476.0" text-anchor="middle">何をする・使いどころ・例・画像</text><text class="sub muted" x="1318.0" y="492.0" text-anchor="middle">Guide の手順からも、ここへ飛べる</text><rect x="1184" y="700" width="268" height="100" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="1318.0" y="736.0" text-anchor="middle">関連（出典）を選ぶ</text><text class="sub muted" x="1318.0" y="754.0" text-anchor="middle">題名・タグに、そのノードの名前がある項目</text><text class="sub muted" x="1318.0" y="770.0" text-anchor="middle">別の文脈（COP・LOP）の記事は出さない</text><text class="muted" x="48" y="650" font-size="12.5" text-anchor="start">説明は Claude が書くので、材料に無いことは書かせない（資料に無ければ空欄）。</text><text class="muted" x="48" y="672" font-size="12.5" text-anchor="start">公開前の点検は、実機の Houdini で自動で行う。</text><text class="muted" x="48" y="704" font-size="12.5" text-anchor="start" font-weight="700">HoudiniReference の項目は、説明の材料にはしない。</text><text class="muted" x="48" y="726" font-size="12.5" text-anchor="start">題名・URL・短い抜粋だけを使い、本文は、出典の元のページにある。</text><path class="edge" d="M 198.0 234.0 L 198.0 300.0" style="stroke:var(--ext)" marker-end="url(#arrow-ext)" /><text class="elabel" x="198.0" y="270.0" text-anchor="middle" style="fill:var(--ext)">資料</text><circle cx="166.0" cy="265.0" r="11" fill="var(--ext)"/><text class="badge-n" x="166.0" y="269.5" text-anchor="middle">1</text><path class="edge" d="M 540 234 L 540 300" style="stroke:var(--ui)" marker-end="url(#arrow-ui)"/><text class="elabel" x="590" y="272" text-anchor="middle" style="fill:var(--ui)">実在する名前</text><path class="edge" d="M 348.0 342.0 L 380.0 342.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><circle cx="364.0" cy="331.0" r="11" fill="var(--core)"/><text class="badge-n" x="364.0" y="335.5" text-anchor="middle">2</text><path class="edge dash" d="M 380.0 192.0 L 370.0 192.0 L 370.0 420.0 L 198.0 420.0 L 198.0 450.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><path class="edge" d="M 540.0 384.0 L 540.0 450.0" style="stroke:var(--safe)" marker-end="url(#arrow-safe)" /><text class="elabel" x="540.0" y="420.0" text-anchor="middle" style="fill:var(--safe)">通過</text><circle cx="508.0" cy="415.0" r="11" fill="var(--safe)"/><text class="badge-n" x="508.0" y="419.5" text-anchor="middle">3</text><path class="edge" d="M 348.0 492.0 L 380.0 492.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><text class="elabel" x="364.0" y="486.0" text-anchor="middle" style="fill:var(--ui)">画像・GIF</text><circle cx="304.0" cy="481.0" r="11" fill="var(--ui)"/><text class="badge-n" x="304.0" y="485.5" text-anchor="middle">4</text><path class="edge" d="M 700 492 L 742 492 L 742 192 L 790 192" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><path class="edge" d="M 940.0 234.0 L 940.0 290.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><path class="edge dash" d="M 940.0 374.0 L 940.0 430.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><path class="edge" d="M 1090 192 L 1184 192" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><text class="elabel" x="1137" y="184" text-anchor="middle" style="fill:var(--core)">HTTPS</text><path class="edge" d="M 1318.0 234.0 L 1318.0 290.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><path class="edge" d="M 1318.0 374.0 L 1318.0 430.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><path class="edge" d="M 1090.0 742.0 L 1184.0 750.0" style="stroke:var(--ext)" marker-end="url(#arrow-ext)" /><text class="elabel" x="1137.0" y="744.0" text-anchor="middle" style="fill:var(--ext)">1日1回 GET</text><circle cx="1063.0" cy="739.0" r="11" fill="var(--ext)"/><text class="badge-n" x="1063.0" y="743.5" text-anchor="middle">5</text><path class="edge" d="M 1318.0 700.0 L 1318.0 514.0" style="stroke:var(--safe)" marker-end="url(#arrow-safe)" /><text class="elabel" x="1318.0" y="600.0" text-anchor="middle" style="fill:var(--safe)">出典を添える</text><rect x="1383" y="866" width="14" height="14" rx="4" fill="var(--safe)"/><text class="muted" x="1403" y="878" font-size="12">安全・権限</text><rect x="1277" y="866" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1297" y="878" font-size="12">外部サービス</text><rect x="1223" y="866" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1243" y="878" font-size="12">保存</text><rect x="1117" y="866" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1137" y="878" font-size="12">中核（処理）</text><rect x="998" y="866" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1018" y="878" font-size="12">画面・利用者側</text></svg>