<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 810" width="1500" height="810" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="810" fill="var(--bg)"/><text class="title" x="26" y="36">動画ができるまで（RAGReel）</text><text class="muted" x="26" y="58" font-size="13">チュートリアルの手順書から、音声つきの WebM を作り、ダッシュボードに載せる</text><rect x="24" y="80" width="330" height="440" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ui)" stroke-width="2"/><text class="gtitle" x="42" y="108" fill="var(--ui)" style="fill:var(--ui)">入力</text><text class="gsub muted" x="42" y="126">Houdini パネルが用意する</text><rect x="384" y="80" width="1092" height="440" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--core)" stroke-width="2"/><text class="gtitle" x="402" y="108" fill="var(--core)" style="fill:var(--core)">RAGReel エンジン（手元の .exe）</text><text class="gsub muted" x="402" y="126">処理の進み具合がログに出て、パネルの進行バーになる</text><rect x="24" y="560" width="1452" height="190" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--store)" stroke-width="2"/><text class="gtitle" x="42" y="588" fill="var(--store)" style="fill:var(--store)">置き場とダッシュボード</text><rect x="54" y="140" width="270" height="80" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="189.0" y="177.0" text-anchor="middle">手順書 .md ＋ グラフ .json</text><text class="sub muted" x="189.0" y="195.0" text-anchor="middle">チュートリアル本体</text><rect x="54" y="250" width="270" height="80" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="189.0" y="287.0" text-anchor="middle">ステップごとの画面</text><text class="sub muted" x="189.0" y="305.0" text-anchor="middle">ビューポート・ネットワーク</text><rect x="54" y="360" width="270" height="80" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="189.0" y="397.0" text-anchor="middle">台本 .json</text><text class="sub muted" x="189.0" y="415.0" text-anchor="middle">初心者向けの説明（Claude）</text><rect x="414" y="140" width="240" height="80" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="534.0" y="177.0" text-anchor="middle">スライドに分ける</text><text class="sub muted" x="534.0" y="195.0" text-anchor="middle">見出し・手順・コード</text><rect x="694" y="140" width="240" height="80" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="814.0" y="177.0" text-anchor="middle">ナレーションを作る</text><text class="sub muted" x="814.0" y="195.0" text-anchor="middle">スライドごとの音声</text><rect x="974" y="140" width="240" height="80" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1094.0" y="177.0" text-anchor="middle">描画する</text><text class="sub muted" x="1094.0" y="195.0" text-anchor="middle">1コマずつ描く</text><rect x="694" y="340" width="240" height="110" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="814.0" y="381.0" text-anchor="middle">音声の経路</text><text class="sub muted" x="814.0" y="399.0" text-anchor="middle">Worker /tts → Google</text><text class="sub muted" x="814.0" y="415.0" text-anchor="middle">だめなら VOICEVOX → Windows の声</text><rect x="974" y="340" width="240" height="80" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1094.0" y="377.0" text-anchor="middle">エンコード</text><text class="sub muted" x="1094.0" y="395.0" text-anchor="middle">VP9 ＋ Opus の WebM</text><rect x="1234" y="340" width="220" height="80" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1344.0" y="377.0" text-anchor="middle">書き出す</text><text class="sub muted" x="1344.0" y="395.0" text-anchor="middle">output/ に manifest と動画</text><rect x="1234" y="610" width="220" height="100" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="1344.0" y="646.0" text-anchor="middle">手元の output/</text><text class="sub muted" x="1344.0" y="664.0" text-anchor="middle">manifest.json</text><text class="sub muted" x="1344.0" y="680.0" text-anchor="middle">videos/&lt;id&gt;/video.webm</text><rect x="934" y="610" width="250" height="100" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1059.0" y="646.0" text-anchor="middle">アップロード</text><text class="sub muted" x="1059.0" y="664.0" text-anchor="middle">POST /api/videos</text><text class="sub muted" x="1059.0" y="680.0" text-anchor="middle">トークンで認証（上限 約95MB）</text><rect x="634" y="610" width="250" height="100" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="759.0" y="657.0" text-anchor="middle">R2 に保存</text><text class="sub muted" x="759.0" y="675.0" text-anchor="middle">動画・サムネイル・目次</text><rect x="334" y="610" width="250" height="100" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="459.0" y="646.0" text-anchor="middle">ダッシュボード</text><text class="sub muted" x="459.0" y="664.0" text-anchor="middle">ブラウザで見る</text><text class="sub muted" x="459.0" y="680.0" text-anchor="middle">ギャラリー・動画の詳細</text><circle cx="428" cy="138" r="11" fill="var(--core)"/><text class="badge-n" x="428" y="142.5" text-anchor="middle">1</text><circle cx="708" cy="138" r="11" fill="var(--core)"/><text class="badge-n" x="708" y="142.5" text-anchor="middle">2</text><circle cx="988" cy="138" r="11" fill="var(--core)"/><text class="badge-n" x="988" y="142.5" text-anchor="middle">3</text><circle cx="988" cy="338" r="11" fill="var(--core)"/><text class="badge-n" x="988" y="342.5" text-anchor="middle">4</text><circle cx="1248" cy="338" r="11" fill="var(--core)"/><text class="badge-n" x="1248" y="342.5" text-anchor="middle">5</text><text class="muted" x="40" y="540" font-size="12.5" text-anchor="start">アップロードは、動画ができたあとに自動で行うか、「動画」タブの「選択をダッシュボードへ」「未アップロードをすべて」で行います。</text><path class="edge" d="M 324.0 180.0 L 374.0 180.0 L 414.0 180.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 324 290 L 374 290 L 374 180" style="stroke:var(--core)"/><path class="edge" d="M 324 400 L 374 400 L 374 180" style="stroke:var(--core)"/><path class="edge" d="M 654.0 180.0 L 694.0 180.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 934.0 180.0 L 974.0 180.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge dash" d="M 814.0 220.0 L 814.0 340.0" style="stroke:var(--ext)" marker-end="url(#arrow-ext)" /><text class="elabel" x="742.0" y="285.0" text-anchor="middle" style="fill:var(--ext)">音声</text><path class="edge" d="M 1094.0 220.0 L 1094.0 340.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 1214.0 380.0 L 1234.0 380.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 1344.0 420.0 L 1344.0 610.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><path class="edge" d="M 1234.0 660.0 L 1184.0 660.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 934.0 660.0 L 884.0 660.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 634.0 660.0 L 584.0 660.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="609.0" y="654.0" text-anchor="middle" style="fill:var(--core)">配信</text><rect x="1370" y="776" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1390" y="788" font-size="12">外部サービス</text><rect x="1316" y="776" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1336" y="788" font-size="12">保存</text><rect x="1210" y="776" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1230" y="788" font-size="12">中核（処理）</text><rect x="1091" y="776" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1111" y="788" font-size="12">画面・利用者側</text></svg>