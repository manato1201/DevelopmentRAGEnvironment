<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 680" width="1500" height="680" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="680" fill="var(--bg)"/><text class="title" x="26" y="36">費用と上限の流れ</text><text class="muted" x="26" y="58" font-size="13">1回の処理ごとに「確保 → 実行 → 精算」。予算が足りなければ、実行の前に止める</text><rect x="40" y="120" width="240" height="90" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="160.0" y="162.0" text-anchor="middle">キーを確認</text><text class="sub muted" x="160.0" y="180.0" text-anchor="middle">ロール・期限</text><rect x="330" y="120" width="240" height="90" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="450.0" y="162.0" text-anchor="middle">回数の制限</text><text class="sub muted" x="450.0" y="180.0" text-anchor="middle">短い間の連打を止める</text><rect x="620" y="120" width="240" height="90" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="740.0" y="151.0" text-anchor="middle">予算を確保</text><text class="sub muted" x="740.0" y="169.0" text-anchor="middle">見積りの分を先に引く</text><text class="sub muted" x="740.0" y="185.0" text-anchor="middle">足りなければ 429</text><rect x="910" y="120" width="240" height="90" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="1030.0" y="162.0" text-anchor="middle">外部の API を呼ぶ</text><text class="sub muted" x="1030.0" y="180.0" text-anchor="middle">Gemini・Claude・Google TTS</text><rect x="1200" y="120" width="260" height="90" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1330.0" y="162.0" text-anchor="middle">使った分で精算</text><text class="sub muted" x="1330.0" y="180.0" text-anchor="middle">余りを戻す・失敗なら全額戻す</text><circle cx="54" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="54" y="122.5" text-anchor="middle">1</text><circle cx="344" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="344" y="122.5" text-anchor="middle">2</text><circle cx="634" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="634" y="122.5" text-anchor="middle">3</text><circle cx="924" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="924" y="122.5" text-anchor="middle">4</text><circle cx="1214" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="1214" y="122.5" text-anchor="middle">5</text><rect x="620" y="300" width="240" height="70" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><text class="label" x="740.0" y="332.0" text-anchor="middle">429 で止める</text><text class="sub muted" x="740.0" y="350.0" text-anchor="middle">予算超過・回数超過</text><rect x="40" y="420" width="1420" height="220" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--store)" stroke-width="2"/><text class="gtitle" x="58" y="448" fill="var(--store)" style="fill:var(--store)">予算の種類（キーごとに設定）</text><text class="gsub muted" x="58" y="466">管理画面のキー管理で、人ごとに決める</text><rect x="100" y="480" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="128.0" y="513.95" font-size="17" text-anchor="middle">RAG</text><text class="label" x="128.0" y="556" text-anchor="middle">RAG</text><text class="sub muted" x="128.0" y="572" text-anchor="middle">Gemini のトークン</text><text class="sub muted" x="128.0" y="586" text-anchor="middle">質問・検索の補助・チャットの回答</text><rect x="560" y="480" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="588.0" y="515.7" font-size="22" text-anchor="middle">Cl</text><text class="label" x="588.0" y="556" text-anchor="middle">Claude</text><text class="sub muted" x="588.0" y="572" text-anchor="middle">トークン（入力＋出力）</text><text class="sub muted" x="588.0" y="586" text-anchor="middle">チュートリアル・台本（キャッシュは数えない）</text><rect x="1020" y="480" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="1048.0" y="513.95" font-size="17" text-anchor="middle">TTS</text><text class="label" x="1048.0" y="556" text-anchor="middle">音声</text><text class="sub muted" x="1048.0" y="572" text-anchor="middle">文字数（日本時間で1日）</text><text class="sub muted" x="1048.0" y="586" text-anchor="middle">キーごと 50,000 字・全体 300,000 字</text><text class="muted" x="40" y="664" font-size="12.5" text-anchor="start">目安: 1人あたり Claude 予算 約 42万トークン（チュートリアル＋台本で 5〜10回分）。詳しくは cost-and-quota.md。</text><path class="edge" d="M 280.0 165.0 L 330.0 165.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 570.0 165.0 L 620.0 165.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 860.0 165.0 L 910.0 165.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 1150.0 165.0 L 1200.0 165.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 740.0 210.0 L 740.0 300.0" style="stroke:var(--warn)" marker-end="url(#arrow-warn)" /><text class="elabel" x="700.0" y="262.0" text-anchor="middle" style="fill:var(--warn)">足りない</text><rect x="1383" y="646" width="14" height="14" rx="4" fill="var(--warn)"/><text class="muted" x="1403" y="658" font-size="12">注意・制限</text><rect x="1329" y="646" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1349" y="658" font-size="12">保存</text><rect x="1223" y="646" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1243" y="658" font-size="12">外部サービス</text><rect x="1117" y="646" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1137" y="658" font-size="12">中核（処理）</text></svg>