  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1440" height="940" fill="var(--bg)"/><text class="title" x="26" y="36">システム全体の構成</text><text class="muted" x="26" y="58" font-size="13">Houdini の手元の道具と、Cloudflare 上の検索・回答・動画の置き場、外部の AI・サービス</text><rect x="24" y="80" width="400" height="560" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ui)" stroke-width="2"/><text class="gtitle" x="42" y="108" fill="var(--ui)" style="fill:var(--ui)">利用者のPC</text><text class="gsub muted" x="42" y="126">Houdini と動画エンジン</text><rect x="464" y="80" width="580" height="560" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--core)" stroke-width="2"/><text class="gtitle" x="482" y="108" fill="var(--core)" style="fill:var(--core)">Cloudflare（rag-poc）</text><text class="gsub muted" x="482" y="126">検索・回答・Claude の中継・MCP・管理画面。鍵は Secrets に保管</text><rect x="1084" y="80" width="332" height="640" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ext)" stroke-width="2"/><text class="gtitle" x="1102" y="108" fill="var(--ext)" style="fill:var(--ext)">外部のAI・サービス</text><text class="gsub muted" x="1102" y="126">鍵は Worker だけが持つ</text><rect x="24" y="700" width="1020" height="200" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--core)" stroke-width="2"/><text class="gtitle" x="42" y="728" fill="var(--core)" style="fill:var(--core)">Cloudflare（ragreel-gallery）</text><text class="gsub muted" x="42" y="746">動画の置き場とダッシュボード</text><rect x="70" y="190" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="98.0" y="223.95" font-size="17" text-anchor="middle">Hou</text><text class="label" x="98.0" y="266" text-anchor="middle">Houdini パネル</text><text class="sub muted" x="98.0" y="282" text-anchor="middle">チャット・グラフ</text><text class="sub muted" x="98.0" y="296" text-anchor="middle">チュートリアル・設定</text><rect x="270" y="190" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="298.0" y="225.7" font-size="22" text-anchor="middle">RR</text><text class="label" x="298.0" y="266" text-anchor="middle">RAGReel</text><text class="sub muted" x="298.0" y="282" text-anchor="middle">動画を作る .exe</text><rect x="270" y="430" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="298.0" y="465.7" font-size="22" text-anchor="middle">FS</text><text class="label" x="298.0" y="506" text-anchor="middle">保存フォルダ</text><text class="sub muted" x="298.0" y="522" text-anchor="middle">手順書・動画</text><rect x="700" y="190" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="728.0" y="225.7" font-size="22" text-anchor="middle">W</text><text class="label" x="728.0" y="266" text-anchor="middle">Worker</text><text class="sub muted" x="728.0" y="282" text-anchor="middle">/query /search /claude</text><text class="sub muted" x="728.0" y="296" text-anchor="middle">/tts /mcp</text><rect x="560" y="430" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="588.0" y="465.7" font-size="22" text-anchor="middle">D1</text><text class="label" x="588.0" y="506" text-anchor="middle">D1</text><text class="sub muted" x="588.0" y="522" text-anchor="middle">全文検索・履歴・予算</text><rect x="800" y="430" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="828.0" y="463.95" font-size="17" text-anchor="middle">Vec</text><text class="label" x="828.0" y="506" text-anchor="middle">Vectorize</text><text class="sub muted" x="828.0" y="522" text-anchor="middle">意味検索</text><rect x="1200" y="190" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1228.0" y="223.95" font-size="17" text-anchor="middle">Gem</text><text class="label" x="1228.0" y="266" text-anchor="middle">Gemini</text><text class="sub muted" x="1228.0" y="282" text-anchor="middle">埋め込み・回答</text><rect x="1200" y="330" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1228.0" y="365.7" font-size="22" text-anchor="middle">Cl</text><text class="label" x="1228.0" y="406" text-anchor="middle">Claude</text><text class="sub muted" x="1228.0" y="422" text-anchor="middle">チュートリアル生成・台本</text><rect x="1200" y="470" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1228.0" y="503.95" font-size="17" text-anchor="middle">TTS</text><text class="label" x="1228.0" y="546" text-anchor="middle">Google TTS</text><text class="sub muted" x="1228.0" y="562" text-anchor="middle">ナレーションの音声</text><rect x="1200" y="610" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1228.0" y="643.95" font-size="17" text-anchor="middle">MCP</text><text class="label" x="1228.0" y="686" text-anchor="middle">公式MCP</text><text class="sub muted" x="1228.0" y="702" text-anchor="middle">Notion・GitHub・Slack…</text><rect x="270" y="770" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="298.0" y="805.7" font-size="22" text-anchor="middle">W</text><text class="label" x="298.0" y="846" text-anchor="middle">Worker</text><text class="sub muted" x="298.0" y="862" text-anchor="middle">/api/videos（受け口）</text><rect x="560" y="770" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="588.0" y="805.7" font-size="22" text-anchor="middle">R2</text><text class="label" x="588.0" y="846" text-anchor="middle">R2</text><text class="sub muted" x="588.0" y="862" text-anchor="middle">動画・サムネイル・目次</text><rect x="820" y="770" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="848.0" y="803.95" font-size="17" text-anchor="middle">WEB</text><text class="label" x="848.0" y="846" text-anchor="middle">ダッシュボード</text><text class="sub muted" x="848.0" y="862" text-anchor="middle">ブラウザで動画を見る</text><text class="muted" x="318" y="172" font-size="12.5" text-anchor="start" font-weight="700">音声 /tts</text><path class="edge" d="M 98 190 L 98 150 L 728 150 L 728 190" style="stroke:var(--ui)" marker-end="url(#arrow-ui)"/><text class="elabel" x="420" y="142" text-anchor="middle" style="fill:var(--ui)">質問・検索・生成（HTTPS＋APIキー）</text><path class="edge" d="M 298 190 L 298 150" style="stroke:var(--ui)"/><path class="edge" d="M 126.0 218.0 L 270.0 218.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><text class="elabel" x="190.0" y="212.0" text-anchor="middle" style="fill:var(--ui)">動画を作る</text><path class="edge" d="M 298.0 286.0 L 298.0 430.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><text class="elabel" x="345.0" y="400.0" text-anchor="middle" style="fill:var(--ui)">書き出す</text><path class="edge" d="M 728 308 L 728 360 L 588 360 L 588 430" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><path class="edge" d="M 728 360 L 828 360 L 828 430" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><path class="edge" d="M 756 218 L 1064 218" style="stroke:var(--ext)"/><path class="edge" d="M 1064 218 L 1064 638" style="stroke:var(--ext)"/><path class="edge" d="M 1064 218 L 1200 218" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><path class="edge" d="M 1064 358 L 1200 358" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><text class="elabel" x="1132" y="350" text-anchor="middle" style="fill:var(--ext)">予算つきで中継</text><path class="edge" d="M 1064 498 L 1200 498" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><path class="edge" d="M 1064 638 L 1200 638" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><text class="elabel" x="1124" y="630" text-anchor="middle" style="fill:var(--ext)">読み取り＋確認つき</text><path class="edge" d="M 298.0 526.0 L 298.0 770.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><text class="elabel" x="380.0" y="676.0" text-anchor="middle" style="fill:var(--ui)">アップロード（トークン）</text><path class="edge" d="M 326.0 798.0 L 560.0 798.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="443.0" y="792.0" text-anchor="middle" style="fill:var(--core)">保存</text><path class="edge" d="M 616.0 798.0 L 820.0 798.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="718.0" y="792.0" text-anchor="middle" style="fill:var(--core)">配信</text><rect x="1310" y="906" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1330" y="918" font-size="12">外部サービス</text><rect x="1256" y="906" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1276" y="918" font-size="12">保存</text><rect x="1150" y="906" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1170" y="918" font-size="12">中核（処理）</text><rect x="1031" y="906" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1051" y="918" font-size="12">画面・利用者側</text></svg>