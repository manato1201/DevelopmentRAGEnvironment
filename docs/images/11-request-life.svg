<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 910" width="1500" height="910" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="910" fill="var(--bg)"/><text class="title" x="26" y="36">質問が届いて、答えが返るまで（リクエストの一生）</text><text class="muted" x="26" y="58" font-size="13">番号の順。名前を住所に直す → 暗号化した通信で送る → Worker が鍵を確かめる → 検索して回答 → 記録して返す</text><rect x="24" y="90" width="250" height="690" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ui)" stroke-width="2"/><text class="gtitle" x="42" y="118" fill="var(--ui)" style="fill:var(--ui)">利用者</text><text class="gsub muted" x="42" y="136">Houdini パネル・ブラウザ・Slack</text><rect x="310" y="90" width="330" height="170" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ext)" stroke-width="2"/><text class="gtitle" x="328" y="118" fill="var(--ext)" style="fill:var(--ext)">名前を住所に直す</text><text class="gsub muted" x="328" y="136">DNS（インターネットの電話帳）</text><rect x="310" y="300" width="900" height="480" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--core)" stroke-width="2"/><text class="gtitle" x="328" y="328" fill="var(--core)" style="fill:var(--core)">Cloudflare</text><text class="gsub muted" x="328" y="346">世界中の拠点のうち、いちばん近い所が受ける</text><rect x="1250" y="300" width="226" height="480" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ext)" stroke-width="2"/><text class="gtitle" x="1268" y="328" fill="var(--ext)" style="fill:var(--ext)">外部のAI</text><text class="gsub muted" x="1268" y="346">鍵は Worker だけが持つ</text><rect x="70" y="380" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="98.0" y="413.95" font-size="17" text-anchor="middle">Hou</text><text class="label" x="98.0" y="456" text-anchor="middle">チャット・パネル</text><text class="sub muted" x="98.0" y="472" text-anchor="middle">質問を書く</text><rect x="560" y="130" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="588.0" y="163.95" font-size="17" text-anchor="middle">DNS</text><text class="label" x="588.0" y="206" text-anchor="middle">DNS</text><text class="sub muted" x="588.0" y="222" text-anchor="middle">名前 → 住所（IP）</text><rect x="350" y="380" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="378.0" y="413.95" font-size="17" text-anchor="middle">TLS</text><text class="label" x="378.0" y="456" text-anchor="middle">拠点（エッジ）</text><text class="sub muted" x="378.0" y="472" text-anchor="middle">HTTPS を受ける</text><rect x="540" y="380" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="568.0" y="415.7" font-size="22" text-anchor="middle">W</text><text class="label" x="568.0" y="456" text-anchor="middle">Worker</text><text class="sub muted" x="568.0" y="472" text-anchor="middle">index.ts が道案内</text><rect x="730" y="380" width="56" height="56" rx="12" fill="var(--safe)"/><text class="glyph" x="758.0" y="413.95" font-size="17" text-anchor="middle">Key</text><text class="label" x="758.0" y="456" text-anchor="middle">認証・権限</text><text class="sub muted" x="758.0" y="472" text-anchor="middle">キー → ハッシュ</text><text class="sub muted" x="758.0" y="486" text-anchor="middle">→ users で照合</text><rect x="920" y="380" width="56" height="56" rx="12" fill="var(--warn)"/><text class="glyph" x="948.0" y="413.95" font-size="17" text-anchor="middle">Bgt</text><text class="label" x="948.0" y="456" text-anchor="middle">予算の確保</text><text class="sub muted" x="948.0" y="472" text-anchor="middle">上限を超えたら止める</text><rect x="1110" y="380" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="1138.0" y="413.95" font-size="17" text-anchor="middle">Ret</text><text class="label" x="1138.0" y="456" text-anchor="middle">検索</text><text class="sub muted" x="1138.0" y="472" text-anchor="middle">意味＋キーワード</text><rect x="730" y="600" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="758.0" y="635.7" font-size="22" text-anchor="middle">D1</text><text class="label" x="758.0" y="676" text-anchor="middle">D1</text><text class="sub muted" x="758.0" y="692" text-anchor="middle">users・予算・履歴</text><text class="sub muted" x="758.0" y="706" text-anchor="middle">キーワード検索（FTS）</text><rect x="920" y="600" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="948.0" y="633.95" font-size="17" text-anchor="middle">Log</text><text class="label" x="948.0" y="676" text-anchor="middle">精算して保存</text><text class="sub muted" x="948.0" y="692" text-anchor="middle">使った分を引く</text><rect x="1110" y="600" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="1138.0" y="633.95" font-size="17" text-anchor="middle">Vec</text><text class="label" x="1138.0" y="676" text-anchor="middle">Vectorize</text><text class="sub muted" x="1138.0" y="692" text-anchor="middle">意味検索</text><rect x="1335" y="380" width="56" height="56" rx="12" fill="var(--ext)"/><text class="glyph" x="1363.0" y="413.95" font-size="17" text-anchor="middle">Gem</text><text class="label" x="1363.0" y="456" text-anchor="middle">Gemini</text><text class="sub muted" x="1363.0" y="472" text-anchor="middle">検索語の補強・回答</text><circle cx="345" cy="186" r="11" fill="var(--ext)"/><text class="badge-n" x="345" y="190.5" text-anchor="middle">1</text><circle cx="373" cy="186" r="11" fill="var(--ext)"/><text class="badge-n" x="373" y="190.5" text-anchor="middle">2</text><text class="muted" x="392" y="190" font-size="12.5" text-anchor="start" font-weight="700">問い合わせる／住所が返る</text><text class="muted" x="330" y="768" font-size="12" text-anchor="start">失敗したときは、段階ごとに返す: 401（鍵が違う）・403（権限なし）・429（上限）・503（サーバー）</text><text class="muted" x="24" y="892" font-size="12" text-anchor="start">詳しくは、講義 1（インターネットの基礎）・2（Cloudflare の基礎）・5（Worker のコードを読む）。</text><path class="edge dash" d="M 98.0 380.0 L 98.0 158.0 L 560.0 158.0" style="stroke:var(--ext)" marker-end="url(#arrow-ext)" marker-start="url(#arrow-ext)"/><path class="edge" d="M 126.0 408.0 L 350.0 408.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><text class="elabel" x="238.0" y="398.0" text-anchor="middle" style="fill:var(--ui)">HTTPS＋キー</text><circle cx="164.0" cy="393.0" r="11" fill="var(--ui)"/><text class="badge-n" x="164.0" y="397.5" text-anchor="middle">3</text><path class="edge" d="M 406.0 408.0 L 540.0 408.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="473.0" y="398.0" text-anchor="middle" style="fill:var(--core)">起動</text><circle cx="441.0" cy="393.0" r="11" fill="var(--core)"/><text class="badge-n" x="441.0" y="397.5" text-anchor="middle">4</text><path class="edge" d="M 596.0 408.0 L 730.0 408.0" style="stroke:var(--safe)" marker-end="url(#arrow-safe)" /><text class="elabel" x="663.0" y="398.0" text-anchor="middle" style="fill:var(--safe)">鍵を照合</text><circle cx="617.0" cy="393.0" r="11" fill="var(--safe)"/><text class="badge-n" x="617.0" y="397.5" text-anchor="middle">5</text><path class="edge" d="M 786.0 408.0 L 920.0 408.0" style="stroke:var(--warn)" marker-end="url(#arrow-warn)" /><text class="elabel" x="853.0" y="398.0" text-anchor="middle" style="fill:var(--warn)">予算を確保</text><circle cx="800.0" cy="393.0" r="11" fill="var(--warn)"/><text class="badge-n" x="800.0" y="397.5" text-anchor="middle">6</text><path class="edge" d="M 976.0 408.0 L 1110.0 408.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="1043.0" y="398.0" text-anchor="middle" style="fill:var(--core)">質問を渡す</text><circle cx="990.0" cy="393.0" r="11" fill="var(--core)"/><text class="badge-n" x="990.0" y="397.5" text-anchor="middle">7</text><path class="edge dash" d="M 758.0 490.0 L 758.0 600.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><path class="edge dash" d="M 1138.0 476.0 L 1138.0 600.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><text class="elabel" x="1138.0" y="548.0" text-anchor="middle" style="fill:var(--store)">意味で探す</text><path class="edge" d="M 1166.0 408.0 L 1335.0 408.0" style="stroke:var(--ext)" marker-end="url(#arrow-ext)" /><text class="elabel" x="1250.0" y="398.0" text-anchor="middle" style="fill:var(--ext)">回答を作る</text><circle cx="1197.0" cy="393.0" r="11" fill="var(--ext)"/><text class="badge-n" x="1197.0" y="397.5" text-anchor="middle">8</text><path class="edge" d="M 1363 484 L 1363 736 L 962 736 L 962 708" style="stroke:var(--ext)" marker-end="url(#arrow-ext)"/><text class="elabel" x="1190" y="728" text-anchor="middle" style="fill:var(--ext)">回答が返る</text><circle cx="1137.0" cy="723.0" r="11" fill="var(--ext)"/><text class="badge-n" x="1137.0" y="727.5" text-anchor="middle">9</text><path class="edge" d="M 920.0 628.0 L 786.0 628.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><text class="elabel" x="853.0" y="648.0" text-anchor="middle" style="fill:var(--store)">精算・保存</text><circle cx="800.0" cy="643.0" r="11" fill="var(--store)"/><text class="badge-n" x="800.0" y="647.5" text-anchor="middle">10</text><path class="edge" d="M 934 708 L 934 840 L 98 840 L 98 490" style="stroke:var(--ui)" marker-end="url(#arrow-ui)"/><text class="elabel" x="540" y="832" text-anchor="middle" style="fill:var(--ui)">JSON で返す（回答・出典・説明レベル）</text><circle cx="375.0" cy="827.0" r="11" fill="var(--ui)"/><text class="badge-n" x="375.0" y="831.5" text-anchor="middle">11</text><rect x="1383" y="876" width="14" height="14" rx="4" fill="var(--warn)"/><text class="muted" x="1403" y="888" font-size="12">注意・制限</text><rect x="1290" y="876" width="14" height="14" rx="4" fill="var(--safe)"/><text class="muted" x="1310" y="888" font-size="12">安全・権限</text><rect x="1184" y="876" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1204" y="888" font-size="12">外部サービス</text><rect x="1130" y="876" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1150" y="888" font-size="12">保存</text><rect x="1024" y="876" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1044" y="888" font-size="12">中核（処理）</text><rect x="905" y="876" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="925" y="888" font-size="12">画面・利用者側</text></svg>