<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 640" width="1500" height="640" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="640" fill="var(--bg)"/><text class="title" x="26" y="36">チュートリアルと動画ができるまで</text><text class="muted" x="26" y="58" font-size="13">Houdini パネルでトピックを入れてから、ダッシュボードに載るまで（番号の順）</text><rect x="40" y="120" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="165.0" y="154.0" text-anchor="middle">トピックを入力</text><text class="sub muted" x="165.0" y="172.0" text-anchor="middle">Houdini パネルの Tutorial タブ</text><text class="sub muted" x="165.0" y="188.0" text-anchor="middle">条件・参考画像・対象モデル</text><rect x="340" y="120" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="465.0" y="154.0" text-anchor="middle">ナレッジを検索</text><text class="sub muted" x="465.0" y="172.0" text-anchor="middle">Worker /search</text><text class="sub muted" x="465.0" y="188.0" text-anchor="middle">バージョン別・章ヒントつき</text><rect x="640" y="120" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="765.0" y="154.0" text-anchor="middle">授業を設計</text><text class="sub muted" x="765.0" y="172.0" text-anchor="middle">目標・実験・つまずきを決める</text><text class="sub muted" x="765.0" y="188.0" text-anchor="middle">（Claude に1回だけ聞く）</text><rect x="940" y="120" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="1065.0" y="154.0" text-anchor="middle">ノードを組み立てる</text><text class="sub muted" x="1065.0" y="172.0" text-anchor="middle">エージェントが最大80回</text><text class="sub muted" x="1065.0" y="188.0" text-anchor="middle">Claude（Worker 経由・予算つき）</text><rect x="940" y="380" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="1065.0" y="414.0" text-anchor="middle">採点して保存</text><text class="sub muted" x="1065.0" y="432.0" text-anchor="middle">手順書 .md ＋ グラフ .json</text><text class="sub muted" x="1065.0" y="448.0" text-anchor="middle">内容を確認して「保存」</text><rect x="640" y="380" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="765.0" y="414.0" text-anchor="middle">台本をつくる</text><text class="sub muted" x="765.0" y="432.0" text-anchor="middle">初心者向けの説明文</text><text class="sub muted" x="765.0" y="448.0" text-anchor="middle">Claude（Worker 経由）</text><rect x="340" y="380" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="465.0" y="414.0" text-anchor="middle">動画を作る</text><text class="sub muted" x="465.0" y="432.0" text-anchor="middle">RAGReel（音声・描画・WebM）</text><text class="sub muted" x="465.0" y="448.0" text-anchor="middle">音声は Worker /tts → Google</text><rect x="40" y="380" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="165.0" y="414.0" text-anchor="middle">ダッシュボードへ</text><text class="sub muted" x="165.0" y="432.0" text-anchor="middle">ギャラリーに自動アップロード</text><text class="sub muted" x="165.0" y="448.0" text-anchor="middle">URL とトークンを設定したとき</text><rect x="1240" y="120" width="230" height="96" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="1355.0" y="154.0" text-anchor="middle">サンドボックス</text><text class="sub muted" x="1355.0" y="172.0" text-anchor="middle">/obj/ai_tutorial_*</text><text class="sub muted" x="1355.0" y="188.0" text-anchor="middle">この中のノードだけを操作</text><circle cx="54" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="54" y="122.5" text-anchor="middle">1</text><circle cx="354" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="354" y="122.5" text-anchor="middle">2</text><circle cx="654" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="654" y="122.5" text-anchor="middle">3</text><circle cx="954" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="954" y="122.5" text-anchor="middle">4</text><circle cx="954" cy="378" r="11" fill="var(--core)"/><text class="badge-n" x="954" y="382.5" text-anchor="middle">5</text><circle cx="654" cy="378" r="11" fill="var(--core)"/><text class="badge-n" x="654" y="382.5" text-anchor="middle">6</text><circle cx="354" cy="378" r="11" fill="var(--core)"/><text class="badge-n" x="354" y="382.5" text-anchor="middle">7</text><circle cx="54" cy="378" r="11" fill="var(--core)"/><text class="badge-n" x="54" y="382.5" text-anchor="middle">8</text><text class="muted" x="1215" y="108" font-size="12.5" text-anchor="middle" font-weight="700">作る・直す</text><text class="muted" x="40" y="540" font-size="13" text-anchor="start">Claude と音声合成の鍵は Worker だけが持ち、キーごとの予算（トークン・文字数）で止まります。Houdini の PC に鍵は置きません。</text><text class="muted" x="40" y="566" font-size="13" text-anchor="start">Houdini の操作は、サンドボックス（/obj/ai_tutorial_*）の中だけ。ファイルへの書き込みや、任意のコード実行のツールは持ちません。</text><path class="edge" d="M 290.0 168.0 L 340.0 168.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 590.0 168.0 L 640.0 168.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 890.0 168.0 L 940.0 168.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 1065.0 216.0 L 1065.0 380.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><text class="elabel" x="1090.0" y="300.0" text-anchor="middle" style="fill:var(--core)">完成</text><path class="edge" d="M 940.0 428.0 L 890.0 428.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 640.0 428.0 L 590.0 428.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 340.0 428.0 L 290.0 428.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 1190.0 168.0 L 1240.0 168.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" marker-start="url(#arrow-ui)"/><rect x="1422" y="606" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1442" y="618" font-size="12">保存</text><rect x="1316" y="606" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1336" y="618" font-size="12">外部サービス</text><rect x="1210" y="606" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1230" y="618" font-size="12">中核（処理）</text><rect x="1091" y="606" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1111" y="618" font-size="12">画面・利用者側</text></svg>