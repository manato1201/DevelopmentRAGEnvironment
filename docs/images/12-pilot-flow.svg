<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" width="1500" height="860" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="860" fill="var(--bg)"/><text class="title" x="26" y="36">実証実験の流れ（1人あたり 3回）</text><text class="muted" x="26" y="58" font-size="13">登録 → 3回（各回に固定課題と自由課題）→ 回ごとにアンケート → 管理画面で集計。対照は、参加者の中に作る</text><rect x="40" y="96" width="330" height="96" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="205.0" y="130.0" text-anchor="middle">1. 事前アンケート</text><text class="sub muted" x="205.0" y="148.0" text-anchor="middle">学習背景・経験・使用歴（氏名は聞かない）</text><text class="sub muted" x="205.0" y="164.0" text-anchor="middle">Houdini の「課題」タブで 1回だけ</text><rect x="430" y="96" width="330" height="96" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="595.0" y="130.0" text-anchor="middle">2. 番号を割り当てる</text><text class="sub muted" x="595.0" y="148.0" text-anchor="middle">参加者番号 P01…（登録順）</text><text class="sub muted" x="595.0" y="164.0" text-anchor="middle">割り当て番号 = ((番号−1) を 3 で割った余り)+1</text><rect x="820" y="96" width="380" height="96" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1010.0" y="130.0" text-anchor="middle">3. 順序と対照が決まる</text><text class="sub muted" x="1010.0" y="148.0" text-anchor="middle">固定課題の順序を、割り当て番号ごとにずらす</text><text class="sub muted" x="1010.0" y="164.0" text-anchor="middle">公式ドキュメントのみの回 = 割り当て番号と同じ回</text><text class="muted" x="40" y="232" font-size="13" text-anchor="start" font-weight="700">割り当て番号 → 固定課題の順（回1・回2・回3）:  1 = Pyro → RBD → 雲（対照は回1） ／ 2 = RBD → 雲 → Pyro（対照は回2） ／ 3 = 雲 → Pyro → RBD（対照は回3）</text><rect x="40" y="260" width="460" height="300" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--gray)" stroke-width="2"/><text class="gtitle" x="58" y="288" fill="var(--gray)" style="fill:var(--gray)">第1回</text><text class="gsub muted" x="58" y="306">割り当て番号 1 の例</text><rect x="64" y="320" width="412" height="100" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><text class="label" x="270.0" y="356.0" text-anchor="middle">固定課題: Pyro（煙・炎）</text><text class="sub muted" x="270.0" y="374.0" text-anchor="middle">公式ドキュメント・Web検索のみ（対照）</text><text class="sub muted" x="270.0" y="390.0" text-anchor="middle">到達の基準: 課題の題材として、作品物ができていること</text><rect x="64" y="440" width="412" height="90" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="270.0" y="471.0" text-anchor="middle">自由課題: 自分の作りたいもの</text><text class="sub muted" x="270.0" y="489.0" text-anchor="middle">本システムを使ってよい</text><text class="sub muted" x="270.0" y="505.0" text-anchor="middle">どの回も同じ（題材は自由）</text><rect x="520" y="260" width="460" height="300" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--gray)" stroke-width="2"/><text class="gtitle" x="538" y="288" fill="var(--gray)" style="fill:var(--gray)">第2回</text><text class="gsub muted" x="538" y="306">割り当て番号 1 の例</text><rect x="544" y="320" width="412" height="100" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="750.0" y="356.0" text-anchor="middle">固定課題: RBD（剛体・破壊）</text><text class="sub muted" x="750.0" y="374.0" text-anchor="middle">本システムを使ってよい</text><text class="sub muted" x="750.0" y="390.0" text-anchor="middle">到達の基準: 課題の題材として、作品物ができていること</text><rect x="544" y="440" width="412" height="90" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="750.0" y="471.0" text-anchor="middle">自由課題: 自分の作りたいもの</text><text class="sub muted" x="750.0" y="489.0" text-anchor="middle">本システムを使ってよい</text><text class="sub muted" x="750.0" y="505.0" text-anchor="middle">どの回も同じ（題材は自由）</text><rect x="1000" y="260" width="460" height="300" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--gray)" stroke-width="2"/><text class="gtitle" x="1018" y="288" fill="var(--gray)" style="fill:var(--gray)">第3回</text><text class="gsub muted" x="1018" y="306">割り当て番号 1 の例</text><rect x="1024" y="320" width="412" height="100" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1230.0" y="356.0" text-anchor="middle">固定課題: 雲（パーティクル）</text><text class="sub muted" x="1230.0" y="374.0" text-anchor="middle">本システムを使ってよい</text><text class="sub muted" x="1230.0" y="390.0" text-anchor="middle">到達の基準: 課題の題材として、作品物ができていること</text><rect x="1024" y="440" width="412" height="90" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1230.0" y="471.0" text-anchor="middle">自由課題: 自分の作りたいもの</text><text class="sub muted" x="1230.0" y="489.0" text-anchor="middle">本システムを使ってよい</text><text class="sub muted" x="1230.0" y="505.0" text-anchor="middle">どの回も同じ（題材は自由）</text><rect x="40" y="590" width="1420" height="96" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="750.0" y="624.0" text-anchor="middle">どの課題も、終えるたびに</text><text class="sub muted" x="750.0" y="642.0" text-anchor="middle">課題後アンケート（難しさ・わかりやすさ・集中・正確性の不安・出典の有用性・また使いたいか）／ 到達 ／ 操作ミスの自己申告</text><text class="sub muted" x="750.0" y="658.0" text-anchor="middle">答えなくても送れる（空欄）。サーバーが記録する: 所要時間・質問回数（時間内の質問を数える）・cookエラーのノード数（Houdini が測る）</text><rect x="40" y="716" width="1420" height="80" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="750.0" y="742.0" text-anchor="middle">4. 集計（管理画面の「実証実験」）</text><text class="sub muted" x="750.0" y="760.0" text-anchor="middle">回 × 種類 × 条件ごとの中央値 ／ 同じ参加者の中で、対照の回と本システムの回を比べる（差の中央値・効果量）／ CSV</text><text class="sub muted" x="750.0" y="776.0" text-anchor="middle">氏名は出さず、P01 のような番号。運営（管理者）のテストは入れない。人数が少ないうちは、参考値</text><path class="edge" d="M 370.0 144.0 L 430.0 144.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 760.0 144.0 L 820.0 144.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 500 410 L 520 410" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><path class="edge" d="M 980 410 L 1000 410" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><rect x="1422" y="826" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1442" y="838" font-size="12">保存</text><rect x="1329" y="826" width="14" height="14" rx="4" fill="var(--warn)"/><text class="muted" x="1349" y="838" font-size="12">注意・制限</text><rect x="1223" y="826" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1243" y="838" font-size="12">中核（処理）</text><rect x="1104" y="826" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1124" y="838" font-size="12">画面・利用者側</text></svg>