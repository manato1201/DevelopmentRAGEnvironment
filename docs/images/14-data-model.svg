<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="900" fill="var(--bg)"/><text class="title" x="26" y="36">データの置き場（D1 の主な表）</text><text class="muted" x="26" y="58" font-size="13">表は migrations/ の SQL で作る。どの表も、利用者は user_id（キーのハッシュ）で users とつながる</text><rect x="24" y="90" width="460" height="280" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--safe)" stroke-width="2"/><text class="gtitle" x="42" y="118" fill="var(--safe)" style="fill:var(--safe)">人と権限</text><text class="gsub muted" x="42" y="136">誰が、どの置き場を、どれだけ使えるか</text><rect x="44" y="152" width="210" height="84" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="149.0" y="180.0" text-anchor="middle">users</text><text class="sub muted" x="149.0" y="198.0" text-anchor="middle">キーのハッシュ＝利用者</text><text class="sub muted" x="149.0" y="214.0" text-anchor="middle">user_id・role・expires_at</text><rect x="264" y="152" width="210" height="84" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="369.0" y="180.0" text-anchor="middle">token_budgets</text><text class="sub muted" x="369.0" y="198.0" text-anchor="middle">トークンの予算</text><text class="sub muted" x="369.0" y="214.0" text-anchor="middle">budget_type・limit・used</text><rect x="44" y="262" width="210" height="84" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="149.0" y="290.0" text-anchor="middle">key_namespace_grants</text><text class="sub muted" x="149.0" y="308.0" text-anchor="middle">キーが使える置き場</text><text class="sub muted" x="149.0" y="324.0" text-anchor="middle">user_id・namespace_id</text><rect x="264" y="262" width="210" height="84" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="369.0" y="290.0" text-anchor="middle">namespaces</text><text class="sub muted" x="369.0" y="308.0" text-anchor="middle">知識の置き場の名前</text><text class="sub muted" x="369.0" y="324.0" text-anchor="middle">scope・token_budget</text><rect x="510" y="90" width="480" height="280" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--core)" stroke-width="2"/><text class="gtitle" x="528" y="118" fill="var(--core)" style="fill:var(--core)">質問と回答</text><text class="gsub muted" x="528" y="136">チャットの履歴と、使われ方の記録</text><rect x="530" y="152" width="220" height="84" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="640.0" y="180.0" text-anchor="middle">memory</text><text class="sub muted" x="640.0" y="198.0" text-anchor="middle">質問と回答の履歴</text><text class="sub muted" x="640.0" y="214.0" text-anchor="middle">rating・pinned・explain_level</text><rect x="770" y="152" width="200" height="84" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="870.0" y="180.0" text-anchor="middle">threads</text><text class="sub muted" x="870.0" y="198.0" text-anchor="middle">会話のまとまり</text><text class="sub muted" x="870.0" y="214.0" text-anchor="middle">thread_id・title</text><rect x="530" y="262" width="220" height="84" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="640.0" y="290.0" text-anchor="middle">audit_log</text><text class="sub muted" x="640.0" y="308.0" text-anchor="middle">利用の記録</text><text class="sub muted" x="640.0" y="324.0" text-anchor="middle">tokens_used・model</text><rect x="770" y="262" width="200" height="84" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="870.0" y="290.0" text-anchor="middle">user_terms</text><text class="sub muted" x="870.0" y="308.0" text-anchor="middle">習熟度（使った専門用語）</text><text class="sub muted" x="870.0" y="324.0" text-anchor="middle">term・count</text><rect x="1016" y="90" width="460" height="280" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--store)" stroke-width="2"/><text class="gtitle" x="1034" y="118" fill="var(--store)" style="fill:var(--store)">ナレッジ（知識の断片）</text><text class="gsub muted" x="1034" y="136">検索の元になるもの</text><rect x="1036" y="152" width="200" height="84" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="1136.0" y="180.0" text-anchor="middle">kb_documents</text><text class="sub muted" x="1136.0" y="198.0" text-anchor="middle">断片（チャンク）の出どころ</text><text class="sub muted" x="1136.0" y="214.0" text-anchor="middle">chunk_id・file・namespace</text><rect x="1256" y="152" width="200" height="84" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="1356.0" y="180.0" text-anchor="middle">chunk_rows</text><text class="sub muted" x="1356.0" y="198.0" text-anchor="middle">全文検索との対応</text><text class="sub muted" x="1356.0" y="214.0" text-anchor="middle">chunk_id・fts_rowid</text><rect x="1036" y="262" width="200" height="84" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="1136.0" y="290.0" text-anchor="middle">FTS（全文検索）</text><text class="sub muted" x="1136.0" y="308.0" text-anchor="middle">キーワードで探す</text><text class="sub muted" x="1136.0" y="324.0" text-anchor="middle">D1 の仮想表</text><rect x="1256" y="262" width="200" height="84" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="1356.0" y="290.0" text-anchor="middle">Vectorize</text><text class="sub muted" x="1356.0" y="308.0" text-anchor="middle">意味で探す</text><text class="sub muted" x="1356.0" y="324.0" text-anchor="middle">D1 の外にある索引</text><rect x="24" y="410" width="460" height="150" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ui)" stroke-width="2"/><text class="gtitle" x="42" y="438" fill="var(--ui)" style="fill:var(--ui)">評価</text><text class="gsub muted" x="42" y="456">チュートリアルの良し悪し</text><rect x="44" y="462" width="420" height="84" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="254.0" y="490.0" text-anchor="middle">tutorial_feedback</text><text class="sub muted" x="254.0" y="508.0" text-anchor="middle">チュートリアルの評価（1人1件×チュートリアル）</text><text class="sub muted" x="254.0" y="524.0" text-anchor="middle">rating・tags・note・metrics（反復・cookエラー・費用）</text><rect x="510" y="410" width="966" height="300" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--plan)" stroke-width="2"/><text class="gtitle" x="528" y="438" fill="var(--plan)" style="fill:var(--plan)">実証実験</text><text class="gsub muted" x="528" y="456">参加者・課題の記録・アンケート（管理者のテストは集計に入れない）</text><rect x="530" y="462" width="260" height="96" rx="10" fill="var(--card)" stroke="var(--plan)" stroke-width="2"/><text class="label" x="660.0" y="496.0" text-anchor="middle">pilot_profile</text><text class="sub muted" x="660.0" y="514.0" text-anchor="middle">参加者（事前アンケート）</text><text class="sub muted" x="660.0" y="530.0" text-anchor="middle">pid（P01…）・slot・経験年数</text><rect x="860" y="462" width="596" height="96" rx="10" fill="var(--card)" stroke="var(--plan)" stroke-width="2"/><text class="label" x="1158.0" y="496.0" text-anchor="middle">pilot_sessions</text><text class="sub muted" x="1158.0" y="514.0" text-anchor="middle">課題1回の記録（固定／自由 × 3回）</text><text class="sub muted" x="1158.0" y="530.0" text-anchor="middle">round・kind・condition・started／ended・duration・paused_sec</text><text class="muted" x="530" y="604" font-size="12.5" text-anchor="start">pilot_sessions のアンケート列: difficulty・clarity・focus・accuracy_worry・source_useful・reuse・reached・self_mistakes・cook_error_nodes</text><text class="muted" x="530" y="630" font-size="12.5" text-anchor="start">discarded_at が入った行は「やり直しで破棄した記録」。同じ（人・回・種類）の有効な行は 1つだけ（部分一意索引）。</text><text class="muted" x="530" y="656" font-size="12.5" text-anchor="start">質問回数は、課題の時間内の memory の数をサーバーが数える（画面の申告に頼らない）。</text><text class="muted" x="24" y="740" font-size="13" text-anchor="start">つながり: memory・audit_log・token_budgets・user_terms・tutorial_feedback・pilot_profile は、どれも user_id で users に結ぶ。</text><text class="muted" x="24" y="764" font-size="13" text-anchor="start">表を増やす・変えるときは、migrations/ に連番の SQL を足す（既存のファイルは直さない）。講義 3・8 を参照。</text><path class="edge" d="M 254.0 304.0 L 264.0 304.0" style="stroke:var(--safe)" marker-end="url(#arrow-safe)" /><path class="edge" d="M 750.0 194.0 L 770.0 194.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 1236.0 194.0 L 1256.0 194.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><path class="edge dash" d="M 1356.0 236.0 L 1356.0 262.0" style="stroke:var(--store)" marker-end="url(#arrow-store)" /><path class="edge" d="M 790.0 510.0 L 860.0 510.0" style="stroke:var(--plan)" marker-end="url(#arrow-plan)" /><text class="elabel" x="825.0" y="496.0" text-anchor="middle" style="fill:var(--plan)">user_id</text><rect x="1409" y="866" width="14" height="14" rx="4" fill="var(--plan)"/><text class="muted" x="1429" y="878" font-size="12">検討中</text><rect x="1290" y="866" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1310" y="878" font-size="12">画面・利用者側</text><rect x="1236" y="866" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1256" y="878" font-size="12">保存</text><rect x="1130" y="866" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1150" y="878" font-size="12">中核（処理）</text><rect x="1037" y="866" width="14" height="14" rx="4" fill="var(--safe)"/><text class="muted" x="1057" y="878" font-size="12">安全・権限</text></svg>