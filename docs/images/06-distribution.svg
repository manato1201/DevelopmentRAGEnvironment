</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="780" fill="var(--bg)"/><text class="title" x="26" y="36">配布と、キー・予算の管理</text><text class="muted" x="26" y="58" font-size="13">運営が作って配り、テスターは zip とインストーラーで入れる。鍵と予算は運営の Worker で管理する</text><rect x="24" y="80" width="446" height="640" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ui)" stroke-width="2"/><text class="gtitle" x="42" y="108" fill="var(--ui)" style="fill:var(--ui)">運営のPC</text><rect x="510" y="80" width="450" height="640" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--core)" stroke-width="2"/><text class="gtitle" x="528" y="108" fill="var(--core)" style="fill:var(--core)">Cloudflare（rag-poc）</text><rect x="1000" y="80" width="476" height="640" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ui)" stroke-width="2"/><text class="gtitle" x="1018" y="108" fill="var(--ui)" style="fill:var(--ui)">テスターのPC</text><rect x="70" y="210" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="98.0" y="243.95" font-size="17" text-anchor="middle">ZIP</text><text class="label" x="98.0" y="286" text-anchor="middle">配布 zip</text><text class="sub muted" x="98.0" y="302" text-anchor="middle">パッケージ＋install.cmd</text><text class="sub muted" x="98.0" y="316" text-anchor="middle">build_houdini_package.py</text><rect x="270" y="210" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="298.0" y="243.95" font-size="17" text-anchor="middle">EXE</text><text class="label" x="298.0" y="286" text-anchor="middle">インストーラー</text><text class="sub muted" x="298.0" y="302" text-anchor="middle">RAGReel-Setup.exe</text><text class="sub muted" x="298.0" y="316" text-anchor="middle">Inno Setup・利用者ごと</text><rect x="170" y="470" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="198.0" y="503.95" font-size="17" text-anchor="middle">ADM</text><text class="label" x="198.0" y="546" text-anchor="middle">管理画面</text><text class="sub muted" x="198.0" y="562" text-anchor="middle">キー・ナレッジ・予算</text><rect x="700" y="210" width="56" height="56" rx="12" fill="var(--core)"/><text class="glyph" x="728.0" y="245.7" font-size="22" text-anchor="middle">W</text><text class="label" x="728.0" y="286" text-anchor="middle">Worker</text><text class="sub muted" x="728.0" y="302" text-anchor="middle">検索・回答・中継</text><rect x="580" y="470" width="56" height="56" rx="12" fill="var(--safe)"/><text class="glyph" x="608.0" y="503.95" font-size="17" text-anchor="middle">KEY</text><text class="label" x="608.0" y="546" text-anchor="middle">キーと予算</text><text class="sub muted" x="608.0" y="562" text-anchor="middle">ロール・範囲・上限</text><rect x="800" y="470" width="56" height="56" rx="12" fill="var(--store)"/><text class="glyph" x="828.0" y="505.7" font-size="22" text-anchor="middle">D1</text><text class="label" x="828.0" y="546" text-anchor="middle">D1</text><text class="sub muted" x="828.0" y="562" text-anchor="middle">履歴・利用量</text><rect x="1040" y="210" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="1068.0" y="243.95" font-size="17" text-anchor="middle">CMD</text><text class="label" x="1068.0" y="286" text-anchor="middle">install.cmd</text><text class="sub muted" x="1068.0" y="302" text-anchor="middle">パッケージ登録・設定</text><rect x="1240" y="210" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="1268.0" y="245.7" font-size="22" text-anchor="middle">RR</text><text class="label" x="1268.0" y="286" text-anchor="middle">RAGReel</text><text class="sub muted" x="1268.0" y="302" text-anchor="middle">動画を作る</text><rect x="1140" y="470" width="56" height="56" rx="12" fill="var(--ui)"/><text class="glyph" x="1168.0" y="503.95" font-size="17" text-anchor="middle">Hou</text><text class="label" x="1168.0" y="546" text-anchor="middle">Houdini パネル</text><text class="sub muted" x="1168.0" y="562" text-anchor="middle">チュートリアル・動画</text><text class="sub muted" x="1168.0" y="576" text-anchor="middle">URL とキーを設定</text><text class="muted" x="40" y="690" font-size="13" text-anchor="start">テスターは、Cloudflare の管理画面に入れません。1人ごとのキーと予算で、使える量が決まります。</text><path class="edge" d="M 98 210 L 98 150 L 1068 150 L 1068 210" style="stroke:var(--store)" marker-end="url(#arrow-store)"/><text class="elabel" x="600" y="142" text-anchor="middle" style="fill:var(--store)">配る（zip）</text><path class="edge" d="M 298 210 L 298 170 L 1268 170 L 1268 210" style="stroke:var(--store)" marker-end="url(#arrow-store)"/><text class="elabel" x="800" y="162" text-anchor="middle" style="fill:var(--store)">配る（インストーラー）</text><path class="edge" d="M 226.0 498.0 L 580.0 498.0" style="stroke:var(--safe)" marker-end="url(#arrow-safe)" /><text class="elabel" x="400.0" y="490.0" text-anchor="middle" style="fill:var(--safe)">キーを発行・予算を決める</text><path class="edge" d="M 608.0 470.0 L 608.0 350.0 L 728.0 350.0 L 728.0 306.0" style="stroke:var(--safe)" marker-end="url(#arrow-safe)" /><path class="edge" d="M 1068.0 306.0 L 1068.0 400.0 L 1168.0 400.0 L 1168.0 470.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><text class="elabel" x="1118.0" y="392.0" text-anchor="middle" style="fill:var(--ui)">設定を書く</text><path class="edge" d="M 1140.0 498.0 L 900.0 498.0 L 900.0 238.0 L 756.0 238.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><text class="elabel" x="1020.0" y="490.0" text-anchor="middle" style="fill:var(--ui)">質問・生成・音声（キー）</text><rect x="1383" y="746" width="14" height="14" rx="4" fill="var(--safe)"/><text class="muted" x="1403" y="758" font-size="12">安全・権限</text><rect x="1329" y="746" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1349" y="758" font-size="12">保存</text><rect x="1223" y="746" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1243" y="758" font-size="12">中核（処理）</text><rect x="1104" y="746" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1124" y="758" font-size="12">画面・利用者側</text></svg>