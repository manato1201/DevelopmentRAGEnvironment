<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" width="1500" height="620" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="620" fill="var(--bg)"/><text class="title" x="26" y="36">質問から回答までの流れ（RAG）</text><text class="muted" x="26" y="58" font-size="13">検索は「意味」と「キーワード」の両方。回答には、必ず出典の番号をつける</text><rect x="40" y="120" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="165.0" y="154.0" text-anchor="middle">質問</text><text class="sub muted" x="165.0" y="172.0" text-anchor="middle">チャット・Houdini・Slack</text><text class="sub muted" x="165.0" y="188.0" text-anchor="middle">（画像を添えてもよい）</text><rect x="340" y="120" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="465.0" y="154.0" text-anchor="middle">作業場所を読む</text><text class="sub muted" x="465.0" y="172.0" text-anchor="middle">SOP / DOP / APEX など</text><text class="sub muted" x="465.0" y="188.0" text-anchor="middle">同名ノードの章の取り違えを防ぐ</text><rect x="640" y="120" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="765.0" y="154.0" text-anchor="middle">検索語を補う</text><text class="sub muted" x="765.0" y="172.0" text-anchor="middle">仮の回答を作って検索に使う</text><text class="sub muted" x="765.0" y="188.0" text-anchor="middle">Gemini（温度0・毎回同じ）</text><rect x="940" y="106" width="250" height="56" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="1065.0" y="131.0" text-anchor="middle">意味で探す</text><text class="sub muted" x="1065.0" y="149.0" text-anchor="middle">Vectorize</text><rect x="940" y="174" width="250" height="56" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="1065.0" y="199.0" text-anchor="middle">キーワードで探す</text><text class="sub muted" x="1065.0" y="217.0" text-anchor="middle">D1 全文検索</text><rect x="940" y="360" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="1065.0" y="394.0" text-anchor="middle">統合して並べる</text><text class="sub muted" x="1065.0" y="412.0" text-anchor="middle">低い一致は除く</text><text class="sub muted" x="1065.0" y="428.0" text-anchor="middle">作業場所の章を先に並べる</text><rect x="640" y="360" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--core)" stroke-width="2"/><text class="label" x="765.0" y="394.0" text-anchor="middle">章が曖昧なら</text><text class="sub muted" x="765.0" y="412.0" text-anchor="middle">既定は SOP と答える</text><text class="sub muted" x="765.0" y="428.0" text-anchor="middle">冒頭に「前提: SOP の場合」</text><rect x="340" y="360" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="465.0" y="394.0" text-anchor="middle">回答を作る</text><text class="sub muted" x="465.0" y="412.0" text-anchor="middle">検索結果だけを根拠に</text><text class="sub muted" x="465.0" y="428.0" text-anchor="middle">Gemini・出典に [1] [2] の番号</text><rect x="40" y="360" width="250" height="96" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="165.0" y="394.0" text-anchor="middle">画面に出す</text><text class="sub muted" x="165.0" y="412.0" text-anchor="middle">出典パネル・根拠の経路</text><text class="sub muted" x="165.0" y="428.0" text-anchor="middle">履歴・お気に入りに保存</text><circle cx="54" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="54" y="122.5" text-anchor="middle">1</text><circle cx="354" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="354" y="122.5" text-anchor="middle">2</text><circle cx="654" cy="118" r="11" fill="var(--core)"/><text class="badge-n" x="654" y="122.5" text-anchor="middle">3</text><circle cx="954" cy="104" r="11" fill="var(--core)"/><text class="badge-n" x="954" y="108.5" text-anchor="middle">4</text><circle cx="954" cy="358" r="11" fill="var(--core)"/><text class="badge-n" x="954" y="362.5" text-anchor="middle">5</text><circle cx="654" cy="358" r="11" fill="var(--core)"/><text class="badge-n" x="654" y="362.5" text-anchor="middle">6</text><circle cx="354" cy="358" r="11" fill="var(--core)"/><text class="badge-n" x="354" y="362.5" text-anchor="middle">7</text><circle cx="54" cy="358" r="11" fill="var(--core)"/><text class="badge-n" x="54" y="362.5" text-anchor="middle">8</text><text class="muted" x="40" y="520" font-size="13" text-anchor="start">ナレッジは namespace（houdini22・shared:…・personal:…）で分かれ、キーごとに、使える範囲が決まっています。</text><text class="muted" x="40" y="546" font-size="13" text-anchor="start">質問のたびに「予算の確保 → 使った分の精算」を行い、失敗したときは、確保した分を戻します。</text><path class="edge" d="M 290.0 168.0 L 340.0 168.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 590.0 168.0 L 640.0 168.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 890 168 L 915 168" style="stroke:var(--core)"/><path class="edge" d="M 915 134 L 915 202" style="stroke:var(--core)"/><path class="edge" d="M 915 134 L 940 134" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><path class="edge" d="M 915 202 L 940 202" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><path class="edge" d="M 1190 134 L 1230 134 L 1230 408 L 1190 408" style="stroke:var(--core)" marker-end="url(#arrow-core)"/><path class="edge" d="M 1190 202 L 1230 202" style="stroke:var(--core)"/><path class="edge" d="M 940.0 408.0 L 890.0 408.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 640.0 408.0 L 590.0 408.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 340.0 408.0 L 290.0 408.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><rect x="1370" y="586" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1390" y="598" font-size="12">外部サービス</text><rect x="1316" y="586" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1336" y="598" font-size="12">保存</text><rect x="1210" y="586" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1230" y="598" font-size="12">中核（処理）</text><rect x="1091" y="586" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1111" y="598" font-size="12">画面・利用者側</text></svg>