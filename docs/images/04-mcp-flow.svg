<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 830" width="1500" height="830" role="img"><style>
  :root { --bg:#f7f8fa; --panel:#eef1f5; --card:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#9aa5b6; --grid:#e6eaf0;
    --ui:#e0782f; --core:#14867a; --store:#6f4fbd; --ext:#2a58d1; --safe:#1b8a5e; --warn:#c0392b; --plan:#a87d12; --gray:#5d6878; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161e; --panel:#1a2230; --card:#232d3f; --fg:#e4e9f1; --muted:#9aa5b6; --line:#6b778a; --grid:#1d2635;
    --ui:#f09a5c; --core:#3fc4b3; --store:#a98bf0; --ext:#7ba2ff; --safe:#55cf98; --warn:#ff9b86; --plan:#e0b84a; --gray:#9aa5b6; } }
  text { font-family: "Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .muted { fill: var(--muted); }
  .title { font-size: 22px; font-weight: 700; }
  .gtitle { font-size: 19px; font-weight: 700; }
  .gsub { font-size: 13px; }
  .label { font-size: 16px; font-weight: 700; }
  .sub { font-size: 13px; }
  .elabel { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .glyph { font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; font-weight: 700; fill: #fff; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.dash { stroke-dasharray: 6 5; }
  .badge-n { font-size: 12px; font-weight: 700; fill: #fff; }
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ui)"/></marker><marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--core)"/></marker><marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--store)"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ext)"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--safe)"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker><marker id="arrow-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--plan)"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--gray)"/></marker></defs><rect width="1500" height="830" fill="var(--bg)"/><text class="title" x="26" y="36">外部サービス（MCP）の使い方と、書き込みの確認</text><text class="muted" x="26" y="58" font-size="13">読み取りはそのまま、書き込みは毎回「実行」を押したときだけ</text><rect x="24" y="80" width="760" height="690" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--core)" stroke-width="2"/><text class="gtitle" x="42" y="108" fill="var(--core)" style="fill:var(--core)">チャットでの流れ</text><text class="gsub muted" x="42" y="126">「外部サービスも使う」をオンにした質問</text><rect x="824" y="80" width="652" height="340" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--ext)" stroke-width="2"/><text class="gtitle" x="842" y="108" fill="var(--ext)" style="fill:var(--ext)">つなげられる10サービス</text><text class="gsub muted" x="842" y="126">公式のリモートMCPだけ（任意のURLは受け付けない）</text><rect x="824" y="440" width="652" height="330" rx="16" fill="var(--panel)" fill-opacity="0.75" stroke="var(--safe)" stroke-width="2"/><text class="gtitle" x="842" y="468" fill="var(--safe)" style="fill:var(--safe)">接続の種類</text><text class="gsub muted" x="842" y="486">誰の権限で動くかで、できることが変わる</text><rect x="54" y="150" width="230" height="90" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="169.0" y="192.0" text-anchor="middle">質問</text><text class="sub muted" x="169.0" y="210.0" text-anchor="middle">チャット画面</text><rect x="314" y="150" width="230" height="90" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="429.0" y="181.0" text-anchor="middle">ツール呼び出し</text><text class="sub muted" x="429.0" y="199.0" text-anchor="middle">Gemini が最大4往復・6回</text><text class="sub muted" x="429.0" y="215.0" text-anchor="middle">結果は外部の文章＝命令にしない</text><rect x="584" y="150" width="170" height="90" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="669.0" y="181.0" text-anchor="middle">読み取り</text><text class="sub muted" x="669.0" y="199.0" text-anchor="middle">そのまま実行</text><text class="sub muted" x="669.0" y="215.0" text-anchor="middle">結果を回答に使う</text><rect x="314" y="330" width="230" height="90" rx="10" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><text class="label" x="429.0" y="361.0" text-anchor="middle">書き込み</text><text class="sub muted" x="429.0" y="379.0" text-anchor="middle">作成・更新・削除・送信</text><text class="sub muted" x="429.0" y="395.0" text-anchor="middle">ここでは実行しない</text><rect x="314" y="500" width="230" height="90" rx="10" fill="var(--card)" stroke="var(--store)" stroke-width="2"/><text class="label" x="429.0" y="531.0" text-anchor="middle">確認待ちを保存</text><text class="sub muted" x="429.0" y="549.0" text-anchor="middle">D1（引数はサーバーに保存）</text><text class="sub muted" x="429.0" y="565.0" text-anchor="middle">1回だけ・5分で失効</text><rect x="54" y="500" width="230" height="90" rx="10" fill="var(--card)" stroke="var(--ui)" stroke-width="2"/><text class="label" x="169.0" y="531.0" text-anchor="middle">確認カード</text><text class="sub muted" x="169.0" y="549.0" text-anchor="middle">内容を見て「実行」を押す</text><text class="sub muted" x="169.0" y="565.0" text-anchor="middle">やめることもできる</text><rect x="54" y="660" width="230" height="90" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="169.0" y="691.0" text-anchor="middle">実行</text><text class="sub muted" x="169.0" y="709.0" text-anchor="middle">/mcp/confirm</text><text class="sub muted" x="169.0" y="725.0" text-anchor="middle">保存した内容だけを実行</text><rect x="584" y="500" width="170" height="90" rx="10" fill="var(--card)" stroke="var(--ext)" stroke-width="2"/><text class="label" x="669.0" y="542.0" text-anchor="middle">外部サービス</text><text class="sub muted" x="669.0" y="560.0" text-anchor="middle">接続した人の権限</text><text class="muted" x="60" y="276" font-size="12.5" text-anchor="start">モデルには、許可したツールだけを見せます。</text><rect x="880" y="140" width="52" height="52" rx="12" fill="var(--ext)"/><text class="glyph" x="906.0" y="173.7" font-size="22" text-anchor="middle">Nt</text><text class="label" x="906.0" y="212" text-anchor="middle">Notion</text><rect x="992" y="140" width="52" height="52" rx="12" fill="var(--ext)"/><text class="glyph" x="1018.0" y="173.7" font-size="22" text-anchor="middle">GH</text><text class="label" x="1018.0" y="212" text-anchor="middle">GitHub</text><rect x="1104" y="140" width="52" height="52" rx="12" fill="var(--ext)"/><text class="glyph" x="1130.0" y="173.7" font-size="22" text-anchor="middle">Sl</text><text class="label" x="1130.0" y="212" text-anchor="middle">Slack</text><rect x="1216" y="140" width="52" height="52" rx="12" fill="var(--ext)"/><text class="glyph" x="1242.0" y="173.7" font-size="22" text-anchor="middle">Gm</text><text class="label" x="1242.0" y="212" text-anchor="middle">Gmail</text><rect x="1328" y="140" width="52" height="52" rx="12" fill="var(--ext)"/><text class="glyph" x="1354.0" y="173.7" font-size="22" text-anchor="middle">Dr</text><text class="label" x="1354.0" y="212" text-anchor="middle">Drive</text><rect x="880" y="260" width="52" height="52" rx="12" fill="var(--ext)"/><text class="glyph" x="906.0" y="291.95" font-size="17" text-anchor="middle">Cal</text><text class="label" x="906.0" y="332" text-anchor="middle">カレンダー</text><rect x="992" y="260" width="52" height="52" rx="12" fill="var(--ext)"/><text class="glyph" x="1018.0" y="293.7" font-size="22" text-anchor="middle">Fg</text><text class="label" x="1018.0" y="332" text-anchor="middle">Figma</text><rect x="1104" y="260" width="52" height="52" rx="12" fill="var(--ext)"/><text class="glyph" x="1130.0" y="293.7" font-size="22" text-anchor="middle">Cv</text><text class="label" x="1130.0" y="332" text-anchor="middle">Canva</text><rect x="1216" y="260" width="52" height="52" rx="12" fill="var(--ext)"/><text class="glyph" x="1242.0" y="293.7" font-size="22" text-anchor="middle">Vc</text><text class="label" x="1242.0" y="332" text-anchor="middle">Vercel</text><rect x="1328" y="260" width="52" height="52" rx="12" fill="var(--ext)"/><text class="glyph" x="1354.0" y="293.7" font-size="22" text-anchor="middle">CF</text><text class="label" x="1354.0" y="332" text-anchor="middle">CF Docs</text><text class="muted" x="850" y="408" font-size="12.5" text-anchor="start">Cloudflare Docs は認証なし。ほかは OAuth（Google・GitHub・Slack は事前の登録が必要）。</text><rect x="860" y="500" width="280" height="110" rx="10" fill="var(--card)" stroke="var(--gray)" stroke-width="2"/><text class="label" x="1000.0" y="541.0" text-anchor="middle">共有の接続</text><text class="sub muted" x="1000.0" y="559.0" text-anchor="middle">管理者が接続・全員のチャットで使う</text><text class="sub muted" x="1000.0" y="575.0" text-anchor="middle">読み取りだけ（書き込まない）</text><rect x="1170" y="500" width="280" height="110" rx="10" fill="var(--card)" stroke="var(--safe)" stroke-width="2"/><text class="label" x="1310.0" y="541.0" text-anchor="middle">自分用の接続</text><text class="sub muted" x="1310.0" y="559.0" text-anchor="middle">本人だけが使う</text><text class="sub muted" x="1310.0" y="575.0" text-anchor="middle">書き込みは許可したツールだけ</text><text class="muted" x="860" y="650" font-size="12.5" text-anchor="start" font-weight="700">個人の権限のサービス（Gmail・Slack・GitHub など）は、「自分用」で接続します。</text><text class="muted" x="860" y="676" font-size="12.5" text-anchor="start">書き込みは、ツールの選択で、そのツールに明示的にチェックを入れたときだけ（初期は読み取りだけ）。</text><text class="muted" x="860" y="702" font-size="12.5" text-anchor="start">実行の記録は監査ログに残りますが、引数の中身は記録しません。</text><path class="edge" d="M 284.0 195.0 L 314.0 195.0" style="stroke:var(--core)" marker-end="url(#arrow-core)" /><path class="edge" d="M 544.0 195.0 L 584.0 195.0" style="stroke:var(--safe)" marker-end="url(#arrow-safe)" /><path class="edge" d="M 429.0 240.0 L 429.0 330.0" style="stroke:var(--warn)" marker-end="url(#arrow-warn)" /><text class="elabel" x="498.0" y="300.0" text-anchor="middle" style="fill:var(--warn)">書き込みのツール</text><path class="edge" d="M 429.0 420.0 L 429.0 500.0" style="stroke:var(--warn)" marker-end="url(#arrow-warn)" /><path class="edge" d="M 314.0 545.0 L 284.0 545.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><path class="edge" d="M 169.0 590.0 L 169.0 660.0" style="stroke:var(--ui)" marker-end="url(#arrow-ui)" /><text class="elabel" x="190.0" y="640.0" text-anchor="middle" style="fill:var(--ui)">「実行」</text><path class="edge" d="M 669.0 240.0 L 669.0 500.0" style="stroke:var(--ext)" marker-end="url(#arrow-ext)" /><text class="elabel" x="672.0" y="380.0" text-anchor="middle" style="fill:var(--ext)">呼ぶ</text><path class="edge" d="M 284.0 705.0 L 669.0 705.0 L 669.0 590.0" style="stroke:var(--safe)" marker-end="url(#arrow-safe)" /><text class="elabel" x="470.0" y="697.0" text-anchor="middle" style="fill:var(--safe)">保存した内容を実行</text><rect x="1383" y="796" width="14" height="14" rx="4" fill="var(--safe)"/><text class="muted" x="1403" y="808" font-size="12">安全・権限</text><rect x="1277" y="796" width="14" height="14" rx="4" fill="var(--ext)"/><text class="muted" x="1297" y="808" font-size="12">外部サービス</text><rect x="1223" y="796" width="14" height="14" rx="4" fill="var(--store)"/><text class="muted" x="1243" y="808" font-size="12">保存</text><rect x="1117" y="796" width="14" height="14" rx="4" fill="var(--core)"/><text class="muted" x="1137" y="808" font-size="12">中核（処理）</text><rect x="998" y="796" width="14" height="14" rx="4" fill="var(--ui)"/><text class="muted" x="1018" y="808" font-size="12">画面・利用者側</text></svg>